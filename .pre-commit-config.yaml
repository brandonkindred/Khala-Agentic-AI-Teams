repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]

  - repo: local
    hooks:
      - id: dbc-docstring-lint
        name: DbC docstring lint (tech_lead_agent / coding_team_orchestrator / shared.cache)
        entry: python backend/agents/software_engineering_team/scripts/check_dbc_docstrings.py
        language: system
        pass_filenames: false
        files: ^backend/(agents/software_engineering_team/(tech_lead_agent/|coding_team_orchestrator\.py)|shared/cache/)
