<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" font-family="Inter, 'Segoe UI', sans-serif">
  <defs>
    <style>
      .h2{font-size:18px;font-weight:600;fill:#ffffff}
      .body{font-size:14px;fill:#ffffff}
      .mut{font-size:12px;fill:#a1a1aa}
      .muted{font-size:11px;fill:#909099}
      .amber{fill:#fde68a;font-weight:600}
      .bad{font-size:13px;font-weight:600;fill:#f87171}
      .good{font-size:13px;font-weight:600;fill:#4ade80}
    </style>
  </defs>
  <rect width="1400" height="560" fill="#000000"/>
  <text x="40" y="44" class="h2">Before &#8594; After</text>

  <!-- ===== BEFORE ===== -->
  <text x="40" y="84" class="bad">BEFORE — a run hides every issue; Dismiss is a dead end</text>
  <rect x="40" y="100" width="620" height="420" rx="12" fill="#171717" stroke="#3a2222"/>
  <text x="64" y="138" class="h2" font-size="16">&#128027; GitHub Issues — acme/widgets</text>
  <line x1="64" y1="152" x2="636" y2="152" stroke="#262626"/>
  <!-- single job panel filling the section -->
  <rect x="64" y="168" width="572" height="320" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/>
  <text x="84" y="198" class="body">&#9881; Working on issue #42</text>
  <!-- Dismiss button -->
  <rect x="520" y="180" width="96" height="28" rx="6" fill="transparent" stroke="#3f3f3f"/>
  <text x="536" y="199" class="mut">&#10005; Dismiss</text>
  <text x="84" y="232" class="mut">Status: running &#183; Phase: coding</text>
  <rect x="84" y="248" width="500" height="6" rx="3" fill="#262626"/><rect x="84" y="248" width="220" height="6" rx="3" fill="#fbbf24"/>
  <text x="84" y="300" class="muted">[ live monitor, agent roster, tasks &#8230; ]</text>
  <!-- the missing issues -->
  <text x="84" y="430" class="bad">&#9888; The issue list is gone — you can't pick another issue.</text>
  <text x="84" y="456" class="muted">Dismiss hides this panel with no way to reopen the run.</text>

  <!-- arrow -->
  <text x="688" y="320" font-size="40" fill="#fbbf24">&#8594;</text>

  <!-- ===== AFTER ===== -->
  <text x="740" y="84" class="good">AFTER — issues always visible; runs live in their own persistent panel</text>
  <rect x="740" y="100" width="620" height="420" rx="12" fill="#171717" stroke="#223a2a"/>
  <!-- left mini issues -->
  <rect x="760" y="120" width="350" height="384" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/>
  <text x="776" y="148" class="body" font-size="13">&#128027; GitHub Issues</text>
  <line x1="776" y1="160" x2="1094" y2="160" stroke="#262626"/>
  <text x="776" y="186" class="amber" font-size="12">#41</text><text x="812" y="186" class="mut">Add OAuth login</text>
  <text x="776" y="214" class="amber" font-size="12">#42</text><text x="812" y="214" class="mut">Fix pagination</text>
  <rect x="980" y="202" width="92" height="16" rx="8" fill="rgba(251,191,36,0.20)"/><text x="988" y="214" font-size="9" fill="#fde68a">In progress</text>
  <text x="776" y="242" class="amber" font-size="12">#43</text><text x="812" y="242" class="mut">Refactor task graph</text>
  <text x="776" y="270" class="amber" font-size="12">#44</text><text x="812" y="270" class="mut">Dark mode toggle</text>
  <text x="776" y="298" class="amber" font-size="12">#45</text><text x="812" y="298" class="mut">Improve error toasts</text>
  <text x="776" y="480" class="good" font-size="11">Always selectable.</text>
  <!-- right mini runs -->
  <rect x="1122" y="120" width="220" height="384" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/>
  <text x="1138" y="148" class="body" font-size="13">&#128296; Runs</text>
  <text x="1138" y="174" class="muted">RUNNING</text>
  <rect x="1134" y="182" width="196" height="34" rx="6" fill="#262626" stroke="#fbbf24"/>
  <rect x="1134" y="182" width="3" height="34" fill="#fbbf24"/>
  <text x="1146" y="203" class="amber" font-size="12">#42 running</text>
  <rect x="1134" y="222" width="196" height="28" rx="6" fill="transparent" stroke="#2e2e2e"/>
  <text x="1146" y="240" class="mut" font-size="11">#44 needs answers</text>
  <text x="1138" y="276" class="muted">RECENT</text>
  <rect x="1134" y="284" width="196" height="26" rx="6" fill="transparent" stroke="#2e2e2e"/>
  <text x="1146" y="301" class="mut" font-size="11">#38 completed</text>
  <text x="1138" y="492" class="good" font-size="11">Persistent · no Dismiss.</text>
</svg>
