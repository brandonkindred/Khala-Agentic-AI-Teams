  # ── Unified API (router/proxy) ──────────────────────────────────────────────
  # Inherits image CMD (run_unified_api.py --workers 1). Do not override to N>1
  # without raising mem_limit; each worker re-imports the full agent graph.
  #
  # mem_limit was 2G, sized for the pre-fix process: 4 uvicorn workers plus an
  # eager Strands/botocore import and a duplicate Temporal worker boot on
  # import (see the workers=1, Pattern-A-boot, and Strands-import-edge fixes).
  # Measured post-fix (this repo's Docker Hub pulls are blocked by org egress
  # policy in this environment, so this ran the unified-api process directly
  # via a local venv rather than the built container): single worker idle RSS
  # ~137 MiB, ~139-140 MiB under light /health + /api/agents load, vs. the
  # pre-fix 4-worker process totaling ~600 MiB idle / ~610 MiB under the same
  # load. Both figures exclude live Postgres/Temporal connections (not wired
  # up in the isolated measurement), so treat them as the process/import-graph
  # floor, not full production RSS. 1G / 512M leaves several times that floor
  # as headroom for the real Postgres pool, Temporal client, and request
  # bursts; re-check with `docker stats` once deployed somewhere with
  # registry access, and raise these back if that shows sustained pressure.

  khala:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: khala-unified-api
    container_name: khala
    depends_on:
      postgres: { condition: service_healthy }
      temporal: { condition: service_started }
      job-service: { condition: service_healthy }
      blogging-service: { condition: service_healthy }
      se-service: { condition: service_healthy }
      pa-service: { condition: service_healthy }
      market-research-service: { condition: service_healthy }
      soc2-service: { condition: service_healthy }
      social-marketing-service: { condition: service_healthy }
      branding-service: { condition: service_healthy }
      agent-provisioning-service: { condition: service_healthy }
      a11y-service: { condition: service_healthy }
      ai-systems-service: { condition: service_healthy }
      investment-service: { condition: service_healthy }
      planning-service: { condition: service_healthy }
      sales-service: { condition: service_healthy }
      road-trip-service: { condition: service_healthy }
      startup-advisor-service: { condition: service_healthy }
      agentic-team-provisioning-service: { condition: service_healthy }
      user-agent-founder-service: { condition: service_healthy }
      deepthought-service: { condition: service_healthy }
      job-matching-service: { condition: service_healthy }
    volumes:
      - agents_workspace:/workspace
      - agents_data:/data/agents
    ports:
      - "8888:8080"
    deploy:
      resources:
        limits: { cpus: "4", memory: 1G }
        reservations: { memory: 512M }
    cpus: "4"
    mem_limit: 1g
    mem_reservation: 512m
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://ollama.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-pro:cloud}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      PYTHONUNBUFFERED: "1"
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      ENABLE_LOG_API: ${ENABLE_LOG_API:-0}
      UNIFIED_API_TEAM_ASSISTANTS_ENABLED: ${UNIFIED_API_TEAM_ASSISTANTS_ENABLED:-true}
      TEMPORAL_ADDRESS: temporal:7233
      JOB_SERVICE_URL: http://job-service:8085
      AGENT_CACHE: /data/agents
      # No OTEL_EXPORTER_OTLP_ENDPOINT: the unified API is a thin proxy. Trace
      # export is limited to se-service / investment-service / branding-service.
      # Knowledge-graph layer (Graphiti + Neo4j). NEO4J_BOLT_URL is the enablement
      # gate for Graphiti inside this process. Left unset by default so khala stays
      # a thin reverse proxy without Graphiti driver/sync overhead; Neo4j still
      # runs for agents. Opt in with NEO4J_BOLT_URL=bolt://neo4j:7687 (extra
      # memory/CPU for the client + background sync worker).
      NEO4J_BOLT_URL: ${NEO4J_BOLT_URL:-}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-please-change-me}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      GRAPHITI_LLM_MODEL: ${GRAPHITI_LLM_MODEL:-}
      GRAPHITI_EMBED_MODEL: ${GRAPHITI_EMBED_MODEL:-nomic-embed-text}
      GRAPHITI_EMBED_DIM: ${GRAPHITI_EMBED_DIM:-768}
      # Team service URLs — proxy requests to team containers
      BLOGGING_SERVICE_URL: http://blogging-service:8090
      SOFTWARE_ENGINEERING_SERVICE_URL: http://se-service:8091
      PERSONAL_ASSISTANT_SERVICE_URL: http://pa-service:8092
      MARKET_RESEARCH_SERVICE_URL: http://market-research-service:8093
      SOC2_COMPLIANCE_SERVICE_URL: http://soc2-service:8094
      SOCIAL_MARKETING_SERVICE_URL: http://social-marketing-service:8095
      BRANDING_SERVICE_URL: http://branding-service:8096
      AGENT_PROVISIONING_SERVICE_URL: http://agent-provisioning-service:8097
      ACCESSIBILITY_AUDIT_SERVICE_URL: http://a11y-service:8098
      AI_SYSTEMS_SERVICE_URL: http://ai-systems-service:8099
      INVESTMENT_SERVICE_URL: http://investment-service:8100
      PLANNING_SERVICE_URL: http://planning-service:8102
      # coding_team is an in-package SE sub-team, served by se-service itself
      # (mounted unprefixed onto the SE app); /api/coding-team/* keeps resolving
      # unchanged since the proxy only forwards the path remainder after the prefix.
      CODING_TEAM_SERVICE_URL: http://se-service:8091
      SALES_TEAM_SERVICE_URL: http://sales-service:8105
      ROAD_TRIP_PLANNING_SERVICE_URL: http://road-trip-service:8106
      STARTUP_ADVISOR_SERVICE_URL: http://startup-advisor-service:8107
      AGENTIC_TEAM_PROVISIONING_SERVICE_URL: http://agentic-team-provisioning-service:8108
      USER_AGENT_FOUNDER_SERVICE_URL: http://user-agent-founder-service:8109
      DEEPTHOUGHT_SERVICE_URL: http://deepthought-service:8110
      JOB_MATCHING_SERVICE_URL: http://job-matching-service:8111
    extra_hosts:
      - "postgres:172.28.0.2"
      - "temporal:172.28.0.3"
      - "job-service:172.28.0.5"
      - "blogging-service:172.28.0.8"
      - "se-service:172.28.0.9"
      - "pa-service:172.28.0.10"
      - "market-research-service:172.28.0.11"
      - "soc2-service:172.28.0.12"
      - "social-marketing-service:172.28.0.13"
      - "branding-service:172.28.0.14"
      - "agent-provisioning-service:172.28.0.15"
      - "a11y-service:172.28.0.16"
      - "ai-systems-service:172.28.0.17"
      - "investment-service:172.28.0.18"
      - "planning-service:172.28.0.20"
      - "sales-service:172.28.0.23"
      - "road-trip-service:172.28.0.24"
      - "startup-advisor-service:172.28.0.25"
      - "agentic-team-provisioning-service:172.28.0.26"
      - "user-agent-founder-service:172.28.0.27"
      - "deepthought-service:172.28.0.28"
      - "job-matching-service:172.28.0.31"
      - "neo4j:172.28.0.32"
    networks:
      stack:
        ipv4_address: 172.28.0.6
        aliases:
          - unified-api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      start_period: 60s
      interval: 15s
      timeout: 10s
      retries: 10

  frontend:
    build:
      context: ../user-interface
      dockerfile: Dockerfile
    image: khala-ui
    container_name: khala-ui
    ports:
      - "4201:80"
    depends_on:
      khala:
        condition: service_healthy
    extra_hosts:
      - "unified-api:172.28.0.6"
    networks:
      stack:
        ipv4_address: 172.28.0.7
    restart: unless-stopped

  # ── Observability (Prometheus + Grafana) ───────────────────────────────────
  # Prometheus scrapes /metrics on the unified API, job-service, and every
  # team microservice (exposed automatically via prometheus-fastapi-instrumentator
  # in backend/team_service/entrypoint.py). Grafana ships with a pre-provisioned
  # Prometheus datasource and a starter FastAPI dashboard.

  prometheus:
    image: prom/prometheus:v3.11.0
    container_name: khala-stack-prometheus
    depends_on:
      khala: { condition: service_healthy }
      job-service: { condition: service_healthy }
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "khala:172.28.0.6"
      - "job-service:172.28.0.5"
      - "blogging-service:172.28.0.8"
      - "se-service:172.28.0.9"
      - "pa-service:172.28.0.10"
      - "market-research-service:172.28.0.11"
      - "soc2-service:172.28.0.12"
      - "social-marketing-service:172.28.0.13"
      - "branding-service:172.28.0.14"
      - "agent-provisioning-service:172.28.0.15"
      - "a11y-service:172.28.0.16"
      - "ai-systems-service:172.28.0.17"
      - "investment-service:172.28.0.18"
      - "planning-service:172.28.0.20"
      - "sales-service:172.28.0.23"
      - "road-trip-service:172.28.0.24"
      - "startup-advisor-service:172.28.0.25"
      - "agentic-team-provisioning-service:172.28.0.26"
      - "user-agent-founder-service:172.28.0.27"
      - "deepthought-service:172.28.0.28"
      - "job-matching-service:172.28.0.31"
    ports:
      - "9090:9090"
    networks:
      stack:
        ipv4_address: 172.28.0.29
        aliases:
          - prometheus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:12.4.2
    container_name: khala-stack-grafana
    depends_on:
      prometheus: { condition: service_healthy }
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    extra_hosts:
      - "prometheus:172.28.0.29"
    ports:
      - "3000:3000"
    networks:
      stack:
        ipv4_address: 172.28.0.30
        aliases:
          - grafana
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Tempo is the trace backend: opted-in app containers (se-service,
  # investment-service, branding-service) export OTLP traces here
  # (OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318). Other team services leave
  # the endpoint unset so spans stay in-process. Grafana reads Tempo via the
  # pre-provisioned "Tempo" datasource. Metrics are NOT sent here — they remain on
  # Prometheus scraping (exporters that are live run OTEL_METRICS_EXPORTER=none).
  tempo:
    image: grafana/tempo:2.7.1
    container_name: khala-stack-tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    # The grafana/tempo image runs as uid 10001; uncomment if Tempo logs a
    # permission error writing /var/tempo on first boot with a fresh volume.
    # user: "0"
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    # Bind to localhost only: app containers export to `tempo:4318` and Grafana
    # queries `tempo:3200` over the docker network, so these host mappings are
    # just operator convenience — no need to expose the trace backend on the LAN.
    ports:
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    networks:
      stack: { ipv4_address: 172.28.0.22, aliases: [tempo] }
    restart: unless-stopped
    # Bound Tempo's footprint on a shared, memory-constrained VM. Tempo was seen
    # as a victim of host-wide (global) OOM; a self-cap keeps its contribution
    # predictable (if it exceeds this it is restarted, visibly, rather than
    # silently enlarging VM pressure on every other container).
    # Both forms are intentional (same pairing as the team services): deploy.*
    # applies under swarm, top-level mem_limit under plain `docker compose up`.
    deploy:
      resources:
        limits: { memory: 1G }
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3200/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  stack:
    name: khala-stack
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/24

volumes:
  # Renamed from `postgres_data` when the stack jumped to Postgres 18. Docker
  # treats a new volume name as a fresh volume, so this is how we declaratively
  # force an empty data dir on major-version bumps without out-of-band
  # `docker compose down -v`. The prior `postgres_data` volume (if any) is
  # left orphaned and can be cleaned up with `docker volume prune`.
  postgres_data_v18:
  agents_workspace:
  agents_data:
  prometheus_data:
  grafana_data:
  tempo_data:
  neo4j_data:
