# Full stack: Postgres, Redis, Temporal, khala (unified API), and Angular UI.
# Run from repo root: docker compose -f docker/docker-compose.yml --env-file docker/.env up --build
# Ports: 5432 Postgres, 6379 Redis (loopback host bind), 7233 Temporal gRPC, 8080 Temporal UI,
# 4201 Angular UI, 8888 Unified API (direct)
#
# Static IPs and extra_hosts pin service addresses so DNS resolution failures
# inside containers don't break inter-service traffic.

# Shared team-service env. Intentionally omits OTEL_EXPORTER_OTLP_ENDPOINT —
# only opted-in services (se / investment / branding) merge *team-otel-export
# so the rest keep spans in-process and do not flood the 1G-capped Tempo.
x-team-env-base: &team-env-base
  LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
  LLM_BASE_URL: ${LLM_BASE_URL:-https://ollama.com}
  LLM_MODEL: ${LLM_MODEL:-deepseek-v4-pro:cloud}
  OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
  PYTHONUNBUFFERED: "1"
  POSTGRES_HOST: postgres
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  POSTGRES_DB: ${POSTGRES_DB:-postgres}
  TEMPORAL_ADDRESS: temporal:7233
  JOB_SERVICE_URL: http://job-service:8085
  UNIFIED_API_BASE_URL: http://khala:8080
  AGENT_CACHE: /data/agents
  # OpenTelemetry SDK knobs (export only when OTEL_EXPORTER_OTLP_ENDPOINT is set
  # via *team-otel-export). Metrics stay on Prometheus scraping.
  OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
  OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-none}
  # Head sampling: SDK TracerProvider reads these when sampler=None. 5% keeps
  # local Tempo under the 1G cgroup while still leaving useful debug traces.
  OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.05}
  # Bound attribute value length and count so oversized LLM prompt/response
  # attributes don't push spans past Tempo's max_bytes_per_trace ingest cap
  # (docker/tempo/tempo.yaml) and get refused.
  OTEL_ATTRIBUTE_VALUE_LENGTH_LIMIT: ${OTEL_ATTRIBUTE_VALUE_LENGTH_LIMIT:-2048}
  OTEL_SPAN_ATTRIBUTE_COUNT_LIMIT: ${OTEL_SPAN_ATTRIBUTE_COUNT_LIMIT:-64}
  # Harden span export so a slow/unavailable Tempo can't pile spans up in a
  # memory-constrained worker: fail fast (5s vs 10s default) and cap the
  # in-process span queue (512 vs 2048 default), flushing more often.
  OTEL_EXPORTER_OTLP_TIMEOUT: ${OTEL_EXPORTER_OTLP_TIMEOUT:-5}
  OTEL_BSP_MAX_QUEUE_SIZE: ${OTEL_BSP_MAX_QUEUE_SIZE:-512}
  OTEL_BSP_MAX_EXPORT_BATCH_SIZE: ${OTEL_BSP_MAX_EXPORT_BATCH_SIZE:-128}
  OTEL_BSP_SCHEDULE_DELAY: ${OTEL_BSP_SCHEDULE_DELAY:-2000}
  # Fewer uvicorn workers per team = a materially smaller footprint on a
  # memory-constrained host (each worker is a full interpreter).
  TEAM_WORKERS: ${TEAM_WORKERS:-1}
  # Sample memory + the cgroup oom_kill counter more often (10s vs 30s) so a
  # silent OOM kill is surfaced promptly in the logs.
  TEAM_MEMORY_WATCHDOG_INTERVAL_S: ${TEAM_MEMORY_WATCHDOG_INTERVAL_S:-10}
  # Defaults overridden per service (kept here so YAML merge still works when a
  # service only overrides TEAM_MODULE / TEAM_PORT / worker entrypoints).
  TEAM_MODULE: software_engineering_team.api.main
  TEAM_NAME: software_engineering_team
  TEAM_PORT: "8091"
  TEAM_TEMPORAL_WORKER_MODULE: software_engineering_team.temporal.worker
  TEAM_TEMPORAL_WORKER_FUNC: start_se_temporal_worker_thread
  SE_WORKSPACE_DIR: /data/agents/software_engineering_team/workspaces

# Shared.cache Redis wiring for SE only (code-review + SE compaction). Kept off
# *team-env-base so other team containers do not receive Redis credentials and
# cannot write `cr:*` / `llm:compact:*` namespaces (review-cache poisoning).
# Prefer REDIS_HOST + REDIS_PASSWORD parts over embedding the password in
# REDIS_URL — Python `shared.cache.config.redis_url()` percent-encodes the
# password. Compose cannot safely quote arbitrary passwords into a URL default.
# In-process memory: set REDIS_HOST= (empty) and leave REDIS_URL blank.
# Use `${REDIS_HOST-redis}` (no `:`) so an empty .env value is preserved —
# `${REDIS_HOST:-redis}` would treat empty as unset and re-default to redis.
# See docs/ENV_VARS.md (REDIS_*).
x-se-redis-env: &se-redis-env
  REDIS_PASSWORD: ${REDIS_PASSWORD:-please-change-me}
  REDIS_HOST: ${REDIS_HOST-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_DB: ${REDIS_DB:-0}
  # Unset/blank REDIS_URL → build from HOST/PORT/PASSWORD (URL-encoded).
  # Explicit REDIS_URL= still wins when non-blank (operator override).
  REDIS_URL: ${REDIS_URL-}
  REDIS_CACHE_TTL_S: ${REDIS_CACHE_TTL_S:-3600}
  REDIS_LOCK_TTL_S: ${REDIS_LOCK_TTL_S:-3600}
  # Independent of lock TTL — crashed leaders unblock waiters after 5m, not 1h.
  REDIS_WAITER_TIMEOUT_S: ${REDIS_WAITER_TIMEOUT_S:-300}
  REDIS_RESULT_TTL_S: ${REDIS_RESULT_TTL_S:-}
  REDIS_SOCKET_CONNECT_TIMEOUT_S: ${REDIS_SOCKET_CONNECT_TIMEOUT_S:-1.0}
  REDIS_SOCKET_TIMEOUT_S: ${REDIS_SOCKET_TIMEOUT_S:-1.0}
  REDIS_MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:-50}
  # Appended to cr:*/llm:compact:* namespaces so a deploy is a cold cache.
  # Leave blank for local (shared hits across restarts of the same image).
  KHALA_BUILD_ID: ${KHALA_BUILD_ID-}
  KHALA_CACHE_BUILD_ID: ${KHALA_CACHE_BUILD_ID-}

# Opt-in OTLP → Tempo. Merge only into services you are actively debugging.
x-team-otel-export: &team-otel-export
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318}

services:
  postgres:
    image: postgres:18
    container_name: khala-stack-postgres
    # 20+ team services × pool max ~10 connections each, plus Temporal, job-service,
    # khala unified API, and the Agent Console pruner can easily exceed the default
    # max_connections=100. Bump it so the stack doesn't run out of slots on cold start.
    command:
      - postgres
      - -c
      - max_connections=500
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      # Per-team sandbox roles (issue #257). Consumed by
      # postgres/init/04-create-sandbox-team-roles.sh on first boot. Unset
      # values skip that team's role; provisioner falls back to the global
      # POSTGRES_* creds for sandboxes in that team.
      POSTGRES_PASSWORD_SANDBOX_BLOGGING: ${POSTGRES_PASSWORD_SANDBOX_BLOGGING:-}
      POSTGRES_PASSWORD_SANDBOX_SOFTWARE_ENGINEERING: ${POSTGRES_PASSWORD_SANDBOX_SOFTWARE_ENGINEERING:-}
      POSTGRES_PASSWORD_SANDBOX_PLANNING: ${POSTGRES_PASSWORD_SANDBOX_PLANNING:-}
      POSTGRES_PASSWORD_SANDBOX_BRANDING: ${POSTGRES_PASSWORD_SANDBOX_BRANDING:-}
    ports:
      - "5432:5432"
    volumes:
      # Mount the parent dir (not `/data`) because the postgres:18 image stores
      # its data under a major-version subdirectory (e.g. /var/lib/postgresql/18/docker)
      # and refuses to start if it finds a legacy `/var/lib/postgresql/data`
      # mount point. See docker-library/postgres#1259.
      - postgres_data_v18:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      stack:
        ipv4_address: 172.28.0.2

  # Neo4j backs the Graphiti knowledge-graph layer over Agent Cognition. Graphiti
  # requires Neo4j >= 5.26, so it is mandatory stack infrastructure for agents
  # (not an optional service). The unified API (khala) does not consume Neo4j by
  # default — set NEO4J_BOLT_URL on a process that needs Graphiti client/sync.
  neo4j:
    image: neo4j:5.26
    container_name: khala-stack-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-please-change-me}
      # Keep memory modest for local dev; raise in production deployments.
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE_SIZE:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_SIZE:-1G}
    ports:
      - "7474:7474"  # HTTP browser UI
      - "7687:7687"  # Bolt protocol
    volumes:
      - neo4j_data:/data
    healthcheck:
      # cypher-shell ships in the image; a trivial query proves the DB is serving.
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-please-change-me} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      stack:
        ipv4_address: 172.28.0.32

  # Redis backs shared.cache for SE (code-review + compaction). Optional for
  # local `make run` (falls back to in-process memory); compose wires REDIS_*
  # only on se-service via *se-redis-env (not every team). Local stack uses
  # requirepass from REDIS_PASSWORD (default please-change-me, same placeholder
  # as Neo4j). Host publish remains IPv4 loopback-only — from the host use
  # ``127.0.0.1:6379``, not ``localhost`` / ``::1``. Production deployments
  # must use a strong secret and keep Redis off public interfaces.
  # See docs/ENV_VARS.md (REDIS_*).
  redis:
    image: redis:7.4-alpine
    container_name: khala-stack-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-please-change-me}
      # Prefer REDISCLI_AUTH over redis-cli -a so the password is not in argv
      # (process listings / healthcheck logs). Same default as REDIS_PASSWORD.
      REDISCLI_AUTH: ${REDIS_PASSWORD:-please-change-me}
    # Cache-only: bound memory; disable RDB/AOF persistence. Use noeviction so
    # idle single-flight lock keys (SET NX EX, not touched during a long
    # compute) are not LRU-evicted under memory pressure — capacity is enforced
    # by shared.cache ZSET trim (with one write-retry after trim on OOM) +
    # key TTLs (default value TTL 1h). A full Redis still fails open on write
    # after the retry. Intentionally no named volume — Redis is an ephemeral
    # shared cache here; durability lives in Postgres / job state, not Redis.
    # A restart is a cold cache, which shared.cache treats as misses (recompute).
    # requirepass lives in a generated conf file so the redis-server argv does
    # not include the password (process listings). Healthcheck still uses
    # REDISCLI_AUTH from the service env. Password bytes are escaped via
    # docker/redis/escape_requirepass.sh as redis.conf ``\xHH`` per byte so
    # backslash, quote, and trailing newlines round-trip under BusyBox Alpine.
    volumes:
      - ./redis/escape_requirepass.sh:/escape_requirepass.sh:ro
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        conf=/tmp/khala-redis.conf
        esc=$$(printf '%s' "$$REDIS_PASSWORD" | /bin/sh /escape_requirepass.sh)
        cat > "$$conf" <<EOF
        bind 0.0.0.0
        requirepass "$$esc"
        maxmemory 512mb
        maxmemory-policy noeviction
        save ""
        appendonly no
        EOF
        exec redis-server "$$conf"
    # Host publish is IPv4 loopback only (127.0.0.1:6379). There is no IPv6
    # host publish — on IPv6-preferring systems use ``127.0.0.1:6379``, not
    # bare ``localhost`` (which may resolve to ``::1`` and fail to connect).
    # Containers still reach Redis via the stack network (redis:6379 /
    # 172.28.0.33).
    # Default REDIS_PASSWORD is local-dev only (public in-repo); never reuse it
    # outside a developer workstation. Host publish stays loopback-bound.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      # Auth via REDISCLI_AUTH (service env above) — redis-cli reads it automatically.
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      stack:
        ipv4_address: 172.28.0.33

  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: khala-stack-temporal
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      DBNAME: temporal
      SKIP_DB_CREATE: "true"
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgres
    extra_hosts:
      - "postgres:172.28.0.2"
    ports:
      - "7233:7233"
    networks:
      stack:
        ipv4_address: 172.28.0.3

  temporal-ui:
    image: temporalio/ui:2.28.0
    container_name: khala-stack-temporal-ui
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: "http://localhost:3000"
    extra_hosts:
      - "temporal:172.28.0.3"
    ports:
      - "8080:8080"
    networks:
      stack:
        ipv4_address: 172.28.0.4

  job-service:
    build:
      context: ../backend
      dockerfile: job_service/Dockerfile
    image: khala-job-service
    container_name: khala-job-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: khala
      POSTGRES_PASSWORD: khala
      POSTGRES_DB: khala_jobs
      PYTHONUNBUFFERED: "1"
      # NOTE: no OTEL_* vars here — the job-service image does not install the
      # OpenTelemetry SDK and its app never calls init_otel(), so it emits no
      # spans. Setting the endpoint would be a misleading no-op. Instrumenting
      # job-service (deps + bootstrap) is a separate follow-up.
    extra_hosts:
      - "postgres:172.28.0.2"
    ports:
      - "8585:8085"
    networks:
      stack:
        ipv4_address: 172.28.0.5
        aliases:
          - job-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Team Microservices ──────────────────────────────────────────────────────
  # Each agent team runs in its own container using the generic team_service/Dockerfile.
  # Blogging uses its own Dockerfile (needs Playwright/Chromium).

  blogging-service:
    build:
      context: ../backend
      dockerfile: blogging_service/Dockerfile
    image: khala-blogging-service
    container_name: khala-blogging-service
    depends_on:
      postgres: { condition: service_healthy }
      temporal: { condition: service_started }
      job-service: { condition: service_healthy }
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://ollama.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-pro:cloud}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      PYTHONUNBUFFERED: "1"
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      TEMPORAL_ADDRESS: temporal:7233
      JOB_SERVICE_URL: http://job-service:8085
      # No OTEL_EXPORTER_OTLP_ENDPOINT: spans stay in-process. Only se-service,
      # investment-service, and branding-service export to the in-stack Tempo.
      BLOG_PLANNING_MAX_ITERATIONS: ${BLOG_PLANNING_MAX_ITERATIONS:-5}
      BLOG_PLANNING_MAX_PARSE_RETRIES: ${BLOG_PLANNING_MAX_PARSE_RETRIES:-3}
      BLOG_PLANNING_MODEL: ${BLOG_PLANNING_MODEL:-}
      AGENT_CACHE: /data/agents
      BLOGGING_RUN_ARTIFACTS_ROOT: /data/agents/blogging_team/runs
      BLOGGING_MEDIUM_STATS_ROOT: ${BLOGGING_MEDIUM_STATS_ROOT:-/data/agents/blogging_team/medium_stats}
      INTEGRATIONS_BROWSER_SESSION_ROOT: ${INTEGRATIONS_BROWSER_SESSION_ROOT:-/data/agents/blogging_team/sessions}
    volumes:
      - agents_data:/data/agents
    extra_hosts: &team-extra-hosts
      - "postgres:172.28.0.2"
      - "temporal:172.28.0.3"
      - "job-service:172.28.0.5"
      - "redis:172.28.0.33"
    ports: ["8090:8090"]
    networks:
      stack: { ipv4_address: 172.28.0.8, aliases: [blogging-service] }
    restart: unless-stopped
    healthcheck: &team-healthcheck-8090
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  se-service:
    build:
      context: ../backend
      dockerfile: team_service/Dockerfile
      args: { TEAM_PORT: "8091" }
    image: khala-se-service
    container_name: khala-se-service
    depends_on:
      postgres: { condition: service_healthy }
      temporal: { condition: service_started }
      job-service: { condition: service_healthy }
      # service_started (not healthy): shared.cache fail-opens when Redis is
      # down, and REDIS_HOST= (empty) opts into in-process memory — SE must
      # still boot if the Redis container is unhealthy or unused.
      redis: { condition: service_started }
    # SE is opted into Tempo export (see *team-otel-export) and shared.cache
    # Redis (*se-redis-env). Other team services inherit *team-env-base only
    # (no Redis credentials) and keep spans in-process.
    environment:
      <<: [*team-env-base, *team-otel-export, *se-redis-env]
    volumes: &team-volumes
      - agents_data:/data/agents
    extra_hosts: *team-extra-hosts
    ports: ["8091:8091"]
    networks:
      stack: { ipv4_address: 172.28.0.9, aliases: [se-service] }
    restart: unless-stopped
    # coding_team's code-review path (now served in-process by this container)
    # loads full diffs + repo context into memory; cap it so a runaway worker
    # is OOM-killed predictably (docker records OOMKilled=true) instead of the
    # host kernel picking a victim. This cgroup limit is also what the
    # team-service memory watchdog samples to warn before the kill. The
    # deploy.resources is read by swarm; mem_limit/mem_reservation enforce the
    # same caps under plain `docker compose up`, matching the unified-api service.
    deploy:
      resources:
        limits: { memory: 4G }
        reservations: { memory: 2G }
    mem_limit: 4g
    mem_reservation: 2g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  pa-service:
    build:
      context: ../backend
      dockerfile: team_service/Dockerfile
      args: { TEAM_PORT: "8092" }
    image: khala-pa-service
    container_name: khala-pa-service
    depends_on:
      postgres: { condition: service_healthy }
      temporal: { condition: service_started }
      job-service: { condition: service_healthy }
    environment:
      <<: *team-env-base
      TEAM_MODULE: personal_assistant_team.api.main
      TEAM_NAME: personal_assistant_team
      TEAM_PORT: "8092"
      TEAM_TEMPORAL_WORKER_MODULE: personal_assistant_team.temporal.worker
      TEAM_TEMPORAL_WORKER_FUNC: start_pa_temporal_worker_thread
    volumes: *team-volumes
    extra_hosts: *team-extra-hosts
    ports: ["8092:8092"]
    networks:
      stack: { ipv4_address: 172.28.0.10, aliases: [pa-service] }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8092/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  market-research-service:
    build:
      context: ../backend
      dockerfile: team_service/Dockerfile
      args: { TEAM_PORT: "8093" }
    image: khala-market-research-service
    container_name: khala-market-research-service
    depends_on:
      postgres: { condition: service_healthy }
      temporal: { condition: service_started }
      job-service: { condition: service_healthy }
    environment:
      <<: *team-env-base
      TEAM_MODULE: market_research_team.api.main
      TEAM_NAME: market_research_team
      TEAM_PORT: "8093"
      TEAM_TEMPORAL_WORKER_MODULE: market_research_team.temporal.worker
      TEAM_TEMPORAL_WORKER_FUNC: start_market_research_temporal_worker_thread
    volumes: *team-volumes
    extra_hosts: *team-extra-hosts
    ports: ["8093:8093"]
    networks:
      stack: { ipv4_address: 172.28.0.11, aliases: [market-research-service] }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8093/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  soc2-service:
    build:
      context: ../backend
      dockerfile: team_service/Dockerfile
      args: { TEAM_PORT: "8094" }
    image: khala-soc2-service
    container_name: khala-soc2-service
    depends_on:
      postgres: { condition: service_healthy }
      temporal: { condition: service_started }
      job-service: { condition: service_healthy }
    environment:
      <<: *team-env-base
      TEAM_MODULE: soc2_compliance_team.api.main
      TEAM_NAME: soc2_compliance_team
      TEAM_PORT: "8094"
      TEAM_TEMPORAL_WORKER_MODULE: soc2_compliance_team.temporal.worker
      TEAM_TEMPORAL_WORKER_FUNC: start_soc2_temporal_worker_thread
    volumes: *team-volumes
    extra_hosts: *team-extra-hosts
    ports: ["8094:8094"]
    networks:
      stack: { ipv4_address: 172.28.0.12, aliases: [soc2-service] }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8094/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  social-marketing-service:
    build:
      context: ../backend
      dockerfile: team_service/Dockerfile
      args: { TEAM_PORT: "8095" }
    image: khala-social-marketing-service
    container_name: khala-social-marketing-service
    depends_on:
      postgres: { condition: service_healthy }
      temporal: { condition: service_started }
      job-service: { condition: service_healthy }
    environment:
      <<: *team-env-base
      TEAM_MODULE: social_media_marketing_team.api.main
      TEAM_NAME: social_media_marketing_team
      TEAM_PORT: "8095"
      TEAM_TEMPORAL_WORKER_MODULE: social_media_marketing_team.temporal.worker
      TEAM_TEMPORAL_WORKER_FUNC: start_social_marketing_temporal_worker_thread
    volumes: *team-volumes
    extra_hosts: *team-extra-hosts
    ports: ["8095:8095"]
    networks:
      stack: { ipv4_address: 172.28.0.13, aliases: [social-marketing-service] }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8095/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  branding-service:
    build:
      context: ../backend
      dockerfile: team_service/Dockerfile
      args: { TEAM_PORT: "8096" }
    image: khala-branding-service
    container_name: khala-branding-service
    depends_on:
      postgres: { condition: service_healthy }
      temporal: { condition: service_started }
      job-service: { condition: service_healthy }
    environment:
      <<: [*team-env-base, *team-otel-export]
      TEAM_MODULE: branding_team.api.main
      TEAM_NAME: branding_team
      TEAM_PORT: "8096"
