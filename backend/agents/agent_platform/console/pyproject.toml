# Coverage config for Agent Console CI (`--cov=agent_platform.console`).
# Live-Postgres store/prune modules are exercised only when POSTGRES_HOST is
# set (test_store.py / test_prune.py skip otherwise). Omit them from the
# unit-coverage gate so the matrix job stays green without a Postgres
# sidecar; the skip-gated live suites remain the regression net for those files.

[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    # Live-Postgres DAL + pruner — covered by skip-gated live suites when Postgres is on.
    "*/console/store.py",
    "*/console/prune.py",
    "agent_platform/console/store.py",
    "agent_platform/console/prune.py",
]

[tool.coverage.report]
exclude_also = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
