# Coverage config for Agent Studio CI (`--cov=agent_team_studio.agent_studio`).
# Live-Postgres store modules are exercised only when POSTGRES_HOST is set
# (test_pg_store.py / test_drafts_pg_store.py skip otherwise). Omit them from
# the unit-coverage gate so the matrix job stays green without a Postgres
# sidecar; the skip-gated live suites remain the regression net for those files.

[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    # Live-Postgres twins — covered by skip-gated live suites when Postgres is on.
    "*/agent_studio/pg_store.py",
    "*/agent_studio/drafts_pg_store.py",
    "agent_team_studio/agent_studio/pg_store.py",
    "agent_team_studio/agent_studio/drafts_pg_store.py",
]

[tool.coverage.report]
exclude_also = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
