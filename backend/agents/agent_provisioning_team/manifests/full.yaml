# Full Tool Manifest for Agent Provisioning
# Sample manifest exercising every supported provisioner. With the tier
# ladder gone (#456), every sandbox gets full access regardless of which
# manifest it ships with — this manifest exists to declare a richer set
# of *tools* (not a higher level of access).

version: "1.0"
base_image: "python:3.11"

environment:
  PYTHONUNBUFFERED: "1"
  LANG: "C.UTF-8"
  TZ: "UTC"

tools:
  # PostgreSQL Database
  - name: postgresql
    provisioner: postgres_provisioner
    config:
      database_prefix: "agent_"
      max_connections: 20
      extensions:
        - pg_trgm
        - uuid-ossp
    onboarding:
      description: "PostgreSQL database for persistent storage"
      env_var: "POSTGRES_URL"
      getting_started: |
        Connect to your database using:
          psql $POSTGRES_URL

        You have full administrative access on this database — create
        tables, indexes, views, extensions as needed.

  # Redis Cache with Pub/Sub
  - name: redis
    provisioner: redis_provisioner
    config:
      key_prefix: "agent:{agent_id}:"
      enable_pubsub: true
    onboarding:
      description: "Redis key-value store + pub/sub"
      env_var: "REDIS_URL"
      getting_started: |
        Connect to Redis:
          redis-cli -u $REDIS_URL

        Every Redis command is allowed (including PUBLISH/SUBSCRIBE for
        real-time messaging). Keys are prefixed with '{key_prefix}'.

  # Git Version Control
  - name: git
    provisioner: git_provisioner
    config:
      init_repos:
        - workspace
        - scratch
      generate_ssh_key: true
    onboarding:
      description: "Git with SSH keys for remote access"
      getting_started: |
        Two repositories are initialized:
          - /workspace (main work area)
          - /scratch (temporary experiments)

        SSH key generated at ~/.ssh/id_ed25519
        Public key available at ~/.ssh/id_ed25519.pub

  # Generic API Access Token
  - name: api_token
    provisioner: generic_provisioner
    config:
      token_type: bearer
      permissions:
        - read
        - write
    onboarding:
      description: "Generic API access token for external services"
      env_var: "API_TOKEN"
      getting_started: |
        An API token has been generated for you.
        Use it in Authorization headers:
          Authorization: Bearer $API_TOKEN

        This token can be used with external APIs that accept bearer tokens.
