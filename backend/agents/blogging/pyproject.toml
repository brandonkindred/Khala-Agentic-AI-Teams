[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "khala-blogging"
version = "0.1.0"
description = "The Khala blogging agent suite: research, planning, writing, copy-editing, compliance, fact-checking, and publication (with optional platform-specific output for Medium, dev.to, and Substack)."
authors = [{ name = "Khala Agent", email = "dev@example.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Ranges here must match agents/blogging/requirements.txt exactly — this file
    # is pip-installed alongside it (see CONTRIBUTORS.md's `pip install -e` step),
    # and a mismatched range here forces pip to re-resolve the other one.
    "pydantic>=2.12,<3.0",
    "httpx>=0.28,<1.0",
    "beautifulsoup4>=4.14,<5.0",
    "fastapi>=0.137,<1.0",
    "starlette>=1.0.1,<2.0",  # CVE-2026-48710 ("BadHost"), fixed in 1.0.1
    "uvicorn[standard]>=0.44,<1.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "blog_research_agent*",
    "blog_planning_agent*",
    "blog_writer_agent*",
    "blog_copy_editor_agent*",
    "blog_publication_agent*",
    "blog_compliance_agent*",
    "blog_fact_check_agent*",
    "blog_plan_critic_agent*",
    "blog_medium_stats_agent*",
    "ghost_writer_agent*",
    "shared*",
    "validators*",
    "temporal*",
    "api*",
    "postgres*",
    "author_profile*",
]
namespaces = false

