[tool.ruff]
target-version = "py310"
line-length = 120
src = ["agents"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "W",      # pycodestyle warnings
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "C901",   # mccabe cyclomatic complexity (threshold below)
    "PLR0915", # pylint too-many-statements (threshold below)
]
ignore = [
    "E501",  # line-length handled by formatter
    "N802",  # function name should be lowercase (some agents use CamelCase)
    "N806",  # variable in function should be lowercase
    "B904",  # raise-without-from (many re-raises are intentional)
    "SIM108", # ternary operator (readability preference)
]

[tool.ruff.lint.isort]
known-first-party = ["shared", "frontend_team", "qa_agent"]

# Complexity gating (C901 / PLR0915). High-water-mark being ratcheted down over
# time toward the ruff defaults (10 / 50). NOTE: this pyproject governs
# unified_api/, blogging_service/, and team_service/ only — everything under
# agents/ resolves agents/.ruff.toml, which carries the same gate (kept in sync)
# plus the grandfathered agents/ debt list.
[tool.ruff.lint.mccabe]
max-complexity = 40

[tool.ruff.lint.pylint]
max-statements = 130

[tool.ruff.lint.per-file-ignores]
"agents/**/tests/**" = ["N", "B", "E402"]
# Example/scaffold agent code: exempt from style (E), but keep pyflakes (F) — incl.
# F821/F822 undefined-name — enforced. (Effective enforcement for agents/ lives in
# agents/.ruff.toml, which only exempts complexity here; this entry is kept in sync.)
"agents/**/agent_implementations/**" = ["E"]
"agents/**/api/main.py" = ["E402"]
"agents/**/api/*.py" = ["E402"]
"agents/blogging/blog_research_agent/agent.py" = ["E402"]
"agents/software_engineering_team/devops_team/orchestrator.py" = ["E402"]
"agents/software_engineering_team/architect_agents/**" = ["E402"]
"unified_api/main.py" = ["E402"]
"unified_api/tests/**" = ["E402"]

[tool.pytest.ini_options]
# Coverage is enforced in CI on every backend test job (see
# .github/workflows/ci.yml). Local `make test` / `pytest` stays fast; run
# `make coverage` to evaluate the 90% gate locally.

[tool.coverage.run]
source = ["agents", "unified_api"]
omit = [
    "*/tests/*",
    "*/conftest.py",
    "*/__init__.py",
    # example/benchmark script; runs hundreds of LLM iterations, not unit-testable
    "agents/blogging/agent_implementations/test_draft_editor_loop.py",
    # thin uvicorn entrypoints — covered indirectly by api/main.py tests
    "agents/blogging/agent_implementations/run_api_server.py",
    "agents/blogging/agent_implementations/run_research_agent.py",
    "agents/blogging/agent_implementations/run_writer_agent.py",
    "agents/blogging/agent_implementations/run_publication_agent.py",
    "agents/blogging/agent_implementations/run_copy_editor_agent.py",
    # blog_writing_process_v2's former orchestrator body now lives in
    # agent_implementations/pipeline/ (one module per stage); the monolith itself
    # is a thin re-export shim that needs no coverage exemption of its own. The
    # three stage modules below wire together many polling/event-driven HITL
    # loops; tightly coupled to live LLM/job state and not meaningfully
    # unit-testable in isolation. Hot paths are covered by integration tests;
    # targeted unit tests still import named helpers (e.g. _run_title_selection,
    # in pipeline/_common.py, which is NOT exempted and carries its own coverage)
    # directly. These three stage-orchestration modules are excluded from the
    # line-coverage gate; pipeline/_common.py, context.py, constants.py, and
    # runner.py are ordinary, fully-gated modules.
    "agents/blogging/agent_implementations/pipeline/planning_stage.py",
    "agents/blogging/agent_implementations/pipeline/draft_stage.py",
    "agents/blogging/agent_implementations/pipeline/gates_stage.py",
    # Temporal entry-point scripts (worker bootstrap, workflow starter, activity
    # wrappers) only exercise correctly inside a live Temporal cluster — the
    # actual orchestrator logic they delegate to is covered separately.
    "agents/software_engineering_team/temporal/start_workflow.py",
    "agents/software_engineering_team/temporal/activities.py",
    "agents/software_engineering_team/temporal/worker.py",
    "agents/software_engineering_team/temporal/workflows.py",
    # Code review agent's Temporal layer — the workflow body only runs inside a
    # live Temporal cluster. The pure resolver (config.py), the boundary DTOs
    # (phase_models.py), and the activity wrappers are covered by
    # tests/test_code_review_temporal.py against the in-process coordinator; the
    # sync dispatch bridge (start_workflow.py) and worker bootstrap (worker.py)
    # are unit-tested against a fake client + real background event loop
    # (tests/test_code_review_start_workflow.py,
    # tests/test_code_review_temporal.py's worker-boot section) so they are
    # deliberately NOT omitted, unlike workflows.py below.
    "agents/software_engineering_team/code_review_agent/temporal/workflows.py",
    # Planning team's Temporal layer — same story: the per-phase workflow body,
    # sync dispatch bridge, and worker bootstrap only run inside a live Temporal
    # cluster. The per-phase activity wrappers (temporal/activities.py) are
    # covered by tests/test_temporal_activities.py against the in-process
    # orchestrator, so activities.py is deliberately NOT omitted.
    "agents/planning_team/temporal/start_workflow.py",
    "agents/planning_team/temporal/worker.py",
    "agents/planning_team/temporal/workflows.py",
    # Accessibility-audit Temporal layer — same story: the per-phase workflow body,
    # sync dispatch bridge, and worker bootstrap only run inside a live Temporal
    # cluster. The per-phase activity wrappers (temporal/activities.py), the name
    # literals (temporal/constants.py), and the shared step helpers
    # (audit_execution.py) are covered by tests/test_temporal_bootstrap.py and
    # tests/test_phase_steps.py against the in-process orchestrator, so they are
    # deliberately NOT omitted.
    "agents/accessibility_audit_team/temporal/start_workflow.py",
    "agents/accessibility_audit_team/temporal/worker.py",
    "agents/accessibility_audit_team/temporal/workflows.py",
    # Thin uvicorn/CLI entrypoints for the SE team — invoke the api/main app
    # without adding any business logic of their own.
    "agents/software_engineering_team/agent_implementations/*",
    # software_engineering_team: PRA agent — the 8+ multi-phase prompt
    # pipeline (epic/story extraction → architecture inference → contract
    # tightening → confidence audit → loop) is end-to-end against the LLM
    # and only meaningful with real model responses. Models/prompts and
    # pure parsers/validators stay covered via tests/test_product_*.py.
    "agents/software_engineering_team/product_requirements_analysis_agent/agent.py",
    # software_engineering_team: v2-team problem-solving phase — drives an
    # LLM gating loop against the freshly written repo (lint runner, build
    # runner, security pass, QA suite). Requires a writable git workspace +
    # real LLM and is exercised via integration runs; the review phase now
    # lives in the shared, config-driven implementation (shared/phases/review.py,
    # shared/v2_review_bindings.py) and is covered there by unit tests with
    # mocked tool agents, same as setup/planning/deliver.
    "agents/software_engineering_team/backend_code_v2_team/phases/problem_solving.py",
    "agents/software_engineering_team/frontend_code_v2_team/phases/problem_solving.py",
    # software_engineering_team: v2-team build specialist — wraps the
    # real `ng build`/`pytest` runners + LLM prompt repair loop, only
    # meaningful when those binaries and the LLM are reachable.
    "agents/software_engineering_team/backend_code_v2_team/tool_agents/build_specialist/agent.py",
    # software_engineering_team: linting_tool_agent.linter_runner — wraps
    # `ruff`/`pylint` subprocess invocations on the agent-generated tree;
    # only runs against real lint binaries + a generated repo.
    "agents/software_engineering_team/linting_tool_agent/linter_runner.py",
    # software_engineering_team: v2-team orchestrators — wire setup → planning →
    # execution → review → problem-solving → deliver around live LLM + npm/git/pytest.
    # The smaller helpers and team-lead/dev-agent shell are covered via dedicated
    # unit tests; the multi-phase `run_workflow` itself only runs end-to-end.
    "agents/software_engineering_team/backend_code_v2_team/orchestrator.py",
    "agents/software_engineering_team/frontend_code_v2_team/orchestrator.py",
    # software_engineering_team: build_fix_specialist — uses Strands `Agent`
    # against the live LLM model registry to repair build failures; pure
    # integration entry point.
    "agents/software_engineering_team/build_fix_specialist/agent.py",
    # software_engineering_team: ai_agent_development_team tool agents — each
    # `run()` builds an LLM prompt and parses JSON back; only meaningful with
    # a live model.
    "agents/software_engineering_team/ai_agent_development_team/tool_agents/agent_runtime/agent.py",
    "agents/software_engineering_team/ai_agent_development_team/tool_agents/evaluation_harness/agent.py",
    "agents/software_engineering_team/ai_agent_development_team/tool_agents/mcp_server_connectivity/agent.py",
    "agents/software_engineering_team/ai_agent_development_team/tool_agents/memory_rag/agent.py",
    "agents/software_engineering_team/ai_agent_development_team/tool_agents/safety_governance/agent.py",
    # software_engineering_team: v2-team tool agents whose `run()` dispatches
    # an LLM phase against the agent-generated workspace. The smaller helpers
    # (resolve_files, group_issues, etc.) are still covered through the
    # per-tool-agent unit tests in tests/test_v2_phases.py and friends.
    "agents/software_engineering_team/frontend_code_v2_team/tool_agents/architecture/agent.py",
    "agents/software_engineering_team/frontend_code_v2_team/tool_agents/security/agent.py",
    "agents/software_engineering_team/frontend_code_v2_team/tool_agents/performance/agent.py",
    "agents/software_engineering_team/frontend_code_v2_team/tool_agents/ui_design/agent.py",
    "agents/software_engineering_team/frontend_code_v2_team/tool_agents/ux_usability/agent.py",
    "agents/software_engineering_team/frontend_code_v2_team/tool_agents/testing_qa/agent.py",
    "agents/software_engineering_team/frontend_code_v2_team/tool_agents/documentation/agent.py",
    "agents/software_engineering_team/frontend_code_v2_team/tool_agents/build_specialist/agent.py",
    "agents/software_engineering_team/backend_code_v2_team/tool_agents/testing_qa/agent.py",
    "agents/software_engineering_team/backend_code_v2_team/tool_agents/security/agent.py",
    "agents/software_engineering_team/backend_code_v2_team/tool_agents/documentation/agent.py",
    # software_engineering_team: dev-side orchestrator agents inside v2 teams
    # (frontend BackendDevelopmentAgent equivalent path) that wire planning →
    # execution → review → deliver against real LLM models.
    "agents/software_engineering_team/ai_agent_development_team/orchestrator.py",
    # software_engineering_team: devops_team/phase2_graph — fans out the
    # IaC/CICD/Deployment agents through a ThreadPoolExecutor; the
    # parallel/sequential split is exercised by integration runs.
    "agents/software_engineering_team/devops_team/phase2_graph.py",
    # unified_api: Medium auto-login drives a real headless Chromium session via
    # Playwright (see the module docstring's `playwright install chromium`
    # prerequisite) and only exercises meaningfully against the live Medium site.
    # Wildcard-prefixed (not "unified_api/...") because coverage.py resolves a
    # relative omit pattern against the *pytest run's* cwd, not this file's own
    # directory: `make coverage` runs from `backend/` (pattern would match) but
    # the CI matrix job's cwd is `backend/agents` (it would not) — "*/" matches
    # the file's absolute path regardless of which cwd invoked pytest.
    "*/unified_api/medium_browser_login.py",
    # unified_api: this file's tests are entirely `@pytest.mark.integration` —
    # they need a live Postgres + job-service sidecar and are exercised by the
    # dedicated `test-integration` CI job (`-m integration`), not by the unit
    # gate here (`-m "not integration"`), so its statements are expected to be
    # unreached in this run.
    "*/unified_api/tests/test_integration_smoke.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
# Standard coverage exclusion patterns plus project-specific markers.
# A line ending with the trailing "# integration-only" marker indicates a
# branch leader (if/elif/else/for/while/try/except) that is gated behind a
# live LLM, subprocess, Temporal, or git workspace and therefore cannot be
# exercised in unit tests; the whole indented block beneath it is excluded.
exclude_also = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.\\s*$",
    "# integration-only$",
    "if __name__ == .__main__.:",
]
