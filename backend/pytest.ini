[pytest]
# Run tests per team from repo root, e.g.:
#   pytest agents/software_engineering_team/tests/ -v
#   pytest agents/blogging/tests/ -v
#   pytest agents/market_research_team/tests/ -v
#   pytest agents/soc2_compliance_team/tests/ -v
#   pytest agents/social_media_marketing_team/tests/ -v
#
# Or from each team directory: cd agents/<team> && pytest
addopts = -v
pythonpath = agents .
# Pick up benchmark modules in addition to the default ``test_*.py`` /
# ``*_test.py`` discovery globs, so ``pytest -m bench`` collects
# ``agents/investment_team/tests/bench/bench_*.py`` without callers having to
# pass each file path explicitly. Default test discovery is preserved.
python_files = test_*.py *_test.py bench_*.py
# Ignore test repos and generated artifacts
# Platform shared package tests (shared.env, shared.postgres, shared.temporal, …) live under shared/.
testpaths = agents shared unified_api agent_sandbox_runtime team_service
norecursedirs = .git .hypothesis __pycache__ *.egg-info .venv venv node_modules dist
markers =
    slow_subprocess: test spawns a strategy subprocess; adds ~1s wall-clock overhead per invocation.
    real_llm: invoke a live LLM provider; skipped unless LLM_PROVIDER and resolve_provider() are non-dummy.
