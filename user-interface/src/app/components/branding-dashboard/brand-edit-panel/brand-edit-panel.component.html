@if (open) {
  <aside class="edit-panel" aria-live="polite" aria-label="Edit brand details">
    <header>
      <h2>Edit details</h2>
      <button mat-icon-button (click)="onClose()" aria-label="Close detail panel">
        <mat-icon>close</mat-icon>
      </button>
    </header>

    <form [formGroup]="form" (ngSubmit)="onApply()" class="edit-form">
      <mat-form-field appearance="outline">
        <mat-label>Company name</mat-label>
        <input matInput formControlName="company_name" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Company description</mat-label>
        <textarea matInput rows="3" formControlName="company_description"></textarea>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Target audience</mat-label>
        <input matInput formControlName="target_audience" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Desired voice</mat-label>
        <input matInput formControlName="desired_voice" placeholder="e.g. clear, confident, human" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Values</mat-label>
        <mat-chip-grid #valuesGrid>
          @for (val of values; track val) {
            <mat-chip-row (removed)="removeValue(val)">
              {{ val }}
              <button matChipRemove><mat-icon>cancel</mat-icon></button>
            </mat-chip-row>
          }
          <input
            placeholder="Add a value..."
            [matChipInputFor]="valuesGrid"
            [matChipInputSeparatorKeyCodes]="separatorKeyCodes"
            [matChipInputAddOnBlur]="true"
            (matChipInputTokenEnd)="addValue($event)"
          />
        </mat-chip-grid>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Differentiators</mat-label>
        <mat-chip-grid #diffGrid>
          @for (diff of differentiators; track diff) {
            <mat-chip-row (removed)="removeDifferentiator(diff)">
              {{ diff }}
              <button matChipRemove><mat-icon>cancel</mat-icon></button>
            </mat-chip-row>
          }
          <input
            placeholder="Add a differentiator..."
            [matChipInputFor]="diffGrid"
            [matChipInputSeparatorKeyCodes]="separatorKeyCodes"
            [matChipInputAddOnBlur]="true"
            (matChipInputTokenEnd)="addDifferentiator($event)"
          />
        </mat-chip-grid>
      </mat-form-field>

      <mat-slide-toggle
        [checked]="skipSave"
        (change)="onSkipSaveToggle($event.checked)"
        class="skip-save-toggle"
      >
        Don't save this brand
      </mat-slide-toggle>

      <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">
        Apply changes
      </button>
    </form>
  </aside>
}
