<div class="widget" role="status" tabindex="0" [attr.aria-label]="summary()" [matTooltip]="summary()">
  <span class="label" aria-hidden="true">APIs:</span>
  @for (s of statuses(); track s.name) {
    <!-- aria-hidden: the container summary is the single announced name; each
         icon keeps a tooltip for sighted/mouse users only. -->
    <span
      class="status"
      aria-hidden="true"
      [matTooltip]="s.name + ': ' + (s.ok ? 'Healthy' : 'Unavailable')"
    >
      @if (s.ok) {
        <mat-icon color="primary" class="icon">check_circle</mat-icon>
      } @else {
        <mat-icon color="warn" class="icon">error</mat-icon>
      }
    </span>
  }
</div>
