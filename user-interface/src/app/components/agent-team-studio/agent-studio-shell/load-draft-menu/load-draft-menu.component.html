<button
  mat-stroked-button
  type="button"
  class="studio__draft-btn"
  [matMenuTriggerFor]="menu"
  [disabled]="busy"
  (menuOpened)="onOpened()"
>
  Load draft ▾
</button>

<mat-menu #menu="matMenu" class="load-draft-menu__panel">
  @if (loading() && drafts().length === 0) {
    <div class="load-draft-menu__loading">
      <mat-spinner diameter="20" />
      <span>Loading…</span>
    </div>
  }

  @if (error() && drafts().length === 0) {
    <p class="load-draft-menu__error" role="alert">
      <mat-icon>error</mat-icon>
      {{ error() }}
    </p>
  }

  @if (!loading() && !error() && drafts().length === 0) {
    <p class="load-draft-menu__empty">No saved drafts yet.</p>
  }

  @for (draft of drafts(); track draft.draft_id) {
    <span class="load-draft-menu__row">
      <button
        mat-menu-item
        type="button"
        class="load-draft-menu__load"
        [disabled]="isDeleting(draft.draft_id)"
        (click)="openDraft(draft.draft_id)"
      >
        <span class="load-draft-menu__body">
          <span class="load-draft-menu__name">{{ draft.name }}</span>
          <span class="load-draft-menu__when">{{ draft.updated_at | date: 'medium' }}</span>
        </span>
      </button>
      <button
        mat-menu-item
        type="button"
        class="load-draft-menu__options"
        [attr.aria-label]="'Options for ' + draft.name"
        [matMenuTriggerFor]="rowMenu"
        [disabled]="isDeleting(draft.draft_id)"
      >
        <mat-icon>more_vert</mat-icon>
      </button>
    </span>
    <mat-menu #rowMenu="matMenu">
      <button mat-menu-item type="button" (click)="confirmDelete(draft)">
        <mat-icon>delete</mat-icon>
        Delete
      </button>
    </mat-menu>
  }

  @if (hasMore()) {
    <button
      mat-stroked-button
      type="button"
      class="load-draft-menu__more"
      [disabled]="loading()"
      (click)="loadMore()"
    >
      @if (loading()) {
        <mat-spinner diameter="16" />
      }
      Show older
    </button>
  }
</mat-menu>
