@if (agentId(); as id) {
  <section class="studio-test">
    <div class="studio-test__bar">
      <button mat-stroked-button type="button" class="studio-test__browse-btn" (click)="openBrowse()">
        <mat-icon aria-hidden="true">search</mat-icon>
        Browse
      </button>
      <span class="studio-test__agent">
        <mat-icon aria-hidden="true">smart_toy</mat-icon>
        <span>agent:&nbsp;<strong>{{ id }}</strong></span>
      </span>
    </div>
    <app-agent-runner [preselectedAgentId]="id" (requestCatalogReturn)="onReturnToBuild()" />
  </section>
} @else {
  <div class="studio-test__empty">
    <mat-icon aria-hidden="true">science</mat-icon>
    <h2>No agent selected yet</h2>
    <p>Pick or build an agent in <strong>Build</strong> first, then return here to run it in its sandbox.</p>
    <button mat-stroked-button type="button" (click)="onReturnToBuild()">← Back to Build</button>
  </div>
}

@if (browseOpen()) {
  <app-agent-studio-slide-out
    [open]="browseOpen()"
    heading="Browse agents"
    panelWidth="min(920px, 96vw)"
    (closeRequested)="closeBrowse()"
  >
    <app-agent-catalog (requestRun)="onBrowseSelect($event)" />
  </app-agent-studio-slide-out>
}
