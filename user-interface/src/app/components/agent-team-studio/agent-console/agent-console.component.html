<mat-tab-group
  class="agent-console"
  animationDuration="120ms"
  mat-stretch-tabs="false"
  mat-align-tabs="start"
>
  <mat-tab>
    <ng-template mat-tab-label>
      <mat-icon>apps</mat-icon>
      <span class="tab-label">Catalog</span>
    </ng-template>
    <div class="agent-console__tab-content agent-console__catalog-tab">
      <header class="agent-console__header">
        <div>
          <h1>Agent Console</h1>
          <p>
            Browse every specialist agent in the system, open their anatomy, and
            run them in isolated sandboxes.
          </p>
        </div>
      </header>
      <app-agent-catalog (requestRun)="onRunAgent($event)"></app-agent-catalog>
    </div>
  </mat-tab>

  <mat-tab>
    <ng-template mat-tab-label>
      <mat-icon>play_circle</mat-icon>
      <span class="tab-label">Runner</span>
    </ng-template>
    <div class="agent-console__tab-content">
      <app-agent-runner
        [preselectedAgentId]="preselectedAgentId()"
        (requestCatalogReturn)="onReturnToCatalog()"
      ></app-agent-runner>
    </div>
  </mat-tab>

  <mat-tab>
    <ng-template mat-tab-label>
      <mat-icon>cloud_queue</mat-icon>
      <span class="tab-label">Provisioning &amp; Environments</span>
    </ng-template>
    <div class="agent-console__tab-content">
      <app-agent-provisioning-dashboard></app-agent-provisioning-dashboard>
    </div>
  </mat-tab>

  <mat-tab>
    <ng-template mat-tab-label>
      <mat-icon>account_tree</mat-icon>
      <span class="tab-label">Backlog</span>
    </ng-template>
    <div class="agent-console__tab-content">
      <app-backlog-tab></app-backlog-tab>
    </div>
  </mat-tab>

  <mat-tab>
    <ng-template mat-tab-label>
      <mat-icon>flag</mat-icon>
      <span class="tab-label">Sprints</span>
    </ng-template>
    <div class="agent-console__tab-content">
      <app-sprints-tab></app-sprints-tab>
    </div>
  </mat-tab>

  <mat-tab>
    <ng-template mat-tab-label>
      <mat-icon>feedback</mat-icon>
      <span class="tab-label">Feedback</span>
    </ng-template>
    <div class="agent-console__tab-content">
      <app-feedback-tab></app-feedback-tab>
    </div>
  </mat-tab>

  <mat-tab>
    <ng-template mat-tab-label>
      <mat-icon>psychology</mat-icon>
      <span class="tab-label">Cognition</span>
    </ng-template>
    <!-- Lazy body: Material eagerly instantiates tab content by default, which
         would fire the catalogue + cognition loads on every Agent Console visit
         even when Cognition is never opened. matTabContent defers them until the
         tab is first selected. -->
    <ng-template matTabContent>
      <div class="agent-console__tab-content">
        <app-cognition-tab></app-cognition-tab>
      </div>
    </ng-template>
  </mat-tab>

  <mat-tab>
    <ng-template mat-tab-label>
      <mat-icon>show_chart</mat-icon>
      <span class="tab-label">Metrics</span>
    </ng-template>
    <!-- Lazy body: defer the metrics fetch until the tab is first opened. -->
    <ng-template matTabContent>
      <div class="agent-console__tab-content">
        <app-metrics-tab></app-metrics-tab>
      </div>
    </ng-template>
  </mat-tab>
</mat-tab-group>
