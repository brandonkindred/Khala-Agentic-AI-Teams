<section class="studio-build">
  <div class="studio-build__bar">
    @if (selectedAgentId(); as id) {
      <span class="studio-build__selected">
        <mat-icon aria-hidden="true">check_circle</mat-icon>
        <span>selected:&nbsp;<strong>{{ id }}</strong> — ready to test</span>
      </span>
    } @else {
      <span class="studio-build__hint">Pick an agent below to work on, then test it in the next step.</span>
    }
    <button mat-stroked-button type="button" class="studio-build__provision-btn" (click)="openProvision()">
      <mat-icon aria-hidden="true">cloud_upload</mat-icon>
      Provision an agent
    </button>
  </div>

  <app-agent-catalog (requestRun)="onSelectAgent($event)" />
</section>

@if (provisionOpen()) {
  <div class="studio-build__scrim" (click)="closeProvision()" aria-hidden="true"></div>
  <aside
    class="studio-build__provision-panel"
    role="dialog"
    aria-modal="true"
    aria-label="Provision an agent"
    cdkTrapFocus
    [cdkTrapFocusAutoCapture]="true"
    (keydown.escape)="closeProvision()"
  >
    <header class="studio-build__provision-head">
      <h2>Provision an agent</h2>
      <button
        mat-icon-button
        type="button"
        aria-label="Close provisioning panel"
        (click)="closeProvision()"
      >
        <mat-icon aria-hidden="true">close</mat-icon>
      </button>
    </header>
    <div class="studio-build__provision-body">
      <app-agent-provisioning-dashboard />
    </div>
  </aside>
}
