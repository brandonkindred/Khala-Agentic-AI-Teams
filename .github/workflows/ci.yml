name: CI/CD

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master, main, development]
  push:
    branches: [master, main, development]

# PR events: group by ref so a new commit cancels the in-flight run for the
# same PR. Push events to default branches: include the SHA in the group so
# every commit gets its own slot — workflow-level concurrency only allows one
# pending run per group, so a shared push group would silently drop
# intermediate commits during rapid merges and skip their build artifacts.
concurrency:
  group: >-
    ${{ github.event_name == 'pull_request'
        && format('ci-{0}-{1}', github.workflow, github.ref)
        || format('ci-{0}-{1}-{2}', github.workflow, github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Change detection ────────────────────────────────────────────────────────
  # Runs once per CI invocation and emits per-area boolean outputs plus a
  # dynamic matrix for the per-team test job. Touching this workflow file
  # triggers every filter so we never ship a broken filter blind.

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    # dorny/paths-filter needs PR-read scope when running on pull_request.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      is_pull_request: ${{ github.event_name == 'pull_request' }}
      lint_python: ${{ steps.filter.outputs.lint_python }}
      lint_frontend: ${{ steps.filter.outputs.lint_frontend }}
      ui: ${{ steps.filter.outputs.ui }}
      shared_postgres: ${{ steps.filter.outputs.shared_postgres }}
      shared_neo4j: ${{ steps.filter.outputs.shared_neo4j }}
      shared_cache: ${{ steps.filter.outputs.shared_cache }}
      shared_backend: ${{ steps.filter.outputs.shared_backend }}
      branding: ${{ steps.filter.outputs.branding }}
      software_engineering: ${{ steps.filter.outputs.software_engineering }}
      agent_cognition: ${{ steps.filter.outputs.agent_cognition }}
      job_matching: ${{ steps.filter.outputs.job_matching }}
      backend_any: ${{ steps.filter.outputs.backend_any }}
      needs_integration: ${{ steps.matrix.outputs.needs_integration }}
      docker_backend: ${{ steps.filter.outputs.docker_backend }}
      docker_blogging_service: ${{ steps.filter.outputs.docker_blogging_service }}
      docker_team_service: ${{ steps.filter.outputs.docker_team_service }}
      docker_frontend: ${{ steps.filter.outputs.docker_frontend }}
      tests_matrix: ${{ steps.matrix.outputs.tests_matrix }}
      tests_matrix_empty: ${{ steps.matrix.outputs.tests_empty }}
      team_services_matrix: ${{ steps.matrix.outputs.team_services_matrix }}
      team_services_matrix_empty: ${{ steps.matrix.outputs.team_services_empty }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ci_workflow:
              - '.github/workflows/ci.yml'
            lint_python:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            lint_frontend:
              - 'user-interface/**'
              - '.github/workflows/ci.yml'
            ui:
              - 'user-interface/**'
              - '.github/workflows/ci.yml'
            # Anything that every team's tests transitively depend on. When
            # this trips, the matrix-builder fans out to all teams below.
            # team_service is the generic wrapper that can run any team, so
            # changes there ripple to every team's runtime path.
            shared_backend:
              # Catch-all so any package added under backend/shared/ later
              # fans out to every team even before it gets its own entry
              # below — keeps this filter from silently missing new packages.
              - 'backend/shared/**'
              - 'backend/shared/postgres/**'
              - 'backend/shared/temporal/**'
              - 'backend/shared/agent_invoke/**'
              - 'backend/shared/graph/**'
              - 'backend/shared/observability/**'
              - 'backend/shared/command_runner/**'
              - 'backend/shared/repo_context/**'
              - 'backend/shared/llm_recovery/**'
              - 'backend/shared/dev_models/**'
              - 'backend/shared/git/**'
              - 'backend/shared/hitl/**'
              - 'backend/shared/run_thread_registry/**'
              - 'backend/agents/llm_service/**'
              - 'backend/agents/event_bus/**'
              - 'backend/agents/artifact_registry/**'
              - 'backend/agents/job_service_client.py'
              - 'backend/agents/job_service_client_fake.py'
              - 'backend/agents/requirements.txt'
              - 'backend/team_service/**'
              - 'backend/unified_api/**'
              - 'backend/conftest.py'
              - 'backend/pyproject.toml'
              - 'backend/pytest.ini'
              - '.github/workflows/ci.yml'
            # Branding runs its full suite (integration + unit) against Postgres +
            # a job-service sidecar in the dedicated test-branding job, so trigger
            # on the team plus the shared infra and test harness it depends on.
            branding:
              - 'backend/agents/branding_team/**'
              - 'backend/shared/postgres/**'
              - 'backend/shared/temporal/**'
              - 'backend/shared/observability/**'
              - 'backend/agents/llm_service/**'
              - 'backend/agents/job_service_client.py'
              - 'backend/agents/job_service_client_fake.py'
              - 'backend/agents/requirements.txt'
              - 'backend/agents/conftest.py'
              - 'backend/conftest.py'
              - 'backend/pytest.ini'
              - 'backend/job_service/**'
              - '.github/workflows/ci.yml'
            backend_any:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            # shared_postgres triggers test-shared-postgres which calls
            # register_all_team_schemas(). That imports each team's
            # `team.postgres` module, which forces Python to evaluate the
            # team's package __init__ first — so a non-postgres change in
            # any of those teams can break schema registration. Trigger
            # paths therefore include every team listed in
            # shared/postgres/registry.py:TEAM_POSTGRES_MODULES (root)
            # plus the postgres/dependency-related files.
            shared_postgres:
              - 'backend/shared/postgres/**'
              - 'backend/agents/**/postgres/**'
              - 'backend/agents/branding_team/**'
              - 'backend/agents/startup_advisor/**'
              - 'backend/agents/agent_team_studio/user_agent_founder/**'
              - 'backend/agents/team_assistant/**'
              - 'backend/agents/agent_team_studio/agentic_team_provisioning/**'
              - 'backend/agents/blogging/**'
              - 'backend/agents/requirements.txt'
              - 'backend/unified_api/postgres/**'
              - 'backend/unified_api/postgres.py'
              - 'backend/job_service/postgres.py'
              - '.github/workflows/ci.yml'
            # shared_neo4j: env-gated Graphiti client; its tests fake graphiti_core
            # and need no live backend, but transitively import llm_service.
            shared_neo4j:
              - 'backend/shared/neo4j/**'
              - 'backend/agents/llm_service/**'
              - 'backend/agents/requirements.txt'
              - '.github/workflows/ci.yml'
            # shared_cache: Redis-backed shared LRU for code-review + compaction.
            # Tests use FakeRedis (no live Redis required). Include consumer trees
            # so mapping/compaction-only PRs still run the live Redis CI step when
            # that job is enabled.
            shared_cache:
              - 'backend/shared/cache/**'
              - 'backend/agents/software_engineering_team/code_review_agent/**'
              - 'backend/agents/software_engineering_team/tests/test_code_review_cache.py'
              - 'backend/agents/software_engineering_team/tests/test_shared_review_cache_integration.py'
              - 'backend/agents/llm_service/compaction.py'
              - 'backend/agents/llm_service/tests/test_compaction.py'
              - 'docker/docker-compose.yml'
              - 'docker/.env.example'
              - 'docker/redis/**'
              - 'backend/agents/requirements.txt'
              - '.github/workflows/ci.yml'
            # agent_cognition: the memory/rules substrate + knowledge-graph layer.
            # Its store/rollup tests need a live Postgres (test-agent-cognition job
            # provides one); the graph tests fake Graphiti (no Neo4j needed). Trigger
            # on its own tree plus the shared infra it imports.
            agent_cognition:
              - 'backend/agents/agent_cognition/**'
              - 'backend/shared/neo4j/**'
              - 'backend/shared/postgres/**'
              - 'backend/agents/llm_service/**'
              - 'backend/agents/agent_registry/**'
              - 'backend/agents/requirements.txt'
              - '.github/workflows/ci.yml'
            # job_matching: narrowly triggers the fresh-database schema-registration
            # regression test only (test-job-matching-schema-registration below runs
            # exactly test_schema_registration.py, not the team's whole test suite —
            # job_matching_team has no general test-backend matrix entry yet, and its
            # sibling test_store.py has a pre-existing, unrelated fixture issue that
            # running the full directory here would surface as a false CI failure).
            job_matching:
              - 'backend/agents/job_matching_team/**'
              - 'backend/agents/user_profile/**'
              - 'backend/shared/postgres/**'
              - 'backend/shared/app/**'
              - 'backend/team_service/**'
              - 'backend/agents/requirements.txt'
              - '.github/workflows/ci.yml'
            # SE imports planning_team, agent_repair_team from its orchestrator
            # and Temporal activities; the coding-team execution engine lives as
            # direct children of software_engineering_team/, so it's already
            # covered by the software_engineering_team/** path below.
            software_engineering:
              - 'backend/agents/software_engineering_team/**'
              - 'backend/agents/planning_team/**'
              - 'backend/agents/agent_repair_team/**'
              # SE's Senior SWE imports the shared repo-inspection tools.
              - 'backend/agents/agent_repo_tools/**'
            # Read-only repo-inspection tools shared by repo-backed agents.
            agent_repo_tools:
              - 'backend/agents/agent_repo_tools/**'
            blogging:
              - 'backend/agents/blogging/**'
              - 'backend/blogging_service/**'
            market_research:
              - 'backend/agents/market_research_team/**'
            soc2:
              - 'backend/agents/soc2_compliance_team/**'
            investment:
              - 'backend/agents/investment_team/**'
            social_marketing:
              - 'backend/agents/social_media_marketing_team/**'
            # agent_provisioning_team imports agent_registry; agent_registry
            # is also covered by shared_backend so that fan-out catches it
            # too, but listing it here keeps the matrix narrow on the common
            # provisioning-only PR.
            agent_provisioning:
              - 'backend/agents/agent_team_studio/agent_provisioning_team/**'
              - 'backend/agents/agent_registry/**'
            # Agent Studio authoring + drafts persistence (in-memory unit suite;
            # live-Postgres store tests skip without POSTGRES_HOST).
            agent_studio:
              - 'backend/agents/agent_team_studio/agent_studio/**'
            # Shared design-assistant conversation kernel (message envelope,
            # fenced-JSON helpers, turn-lock protocol) used by agent_studio and
            # agentic_team_provisioning's chat assistants.
            assistant_kernel:
              - 'backend/agents/agent_team_studio/assistant_kernel/**'
            sales:
              - 'backend/agents/sales_team/**'
            # user_agent_founder's drift tripwire imports the real
            # agentic_team_provisioning models and app routes (and, via its
            # models, agent_registry), so provisioning-side changes must run
            # the founder suite — that tripwire is the only cross-team guard
            # on the founder↔agentic-team contract boundary (see
            # system_design/adr/ADR-007). agentic_team_provisioning's own
            # suite is not in the matrix yet (pre-existing failures); until
            # it is, this filter is what turns CI red on that boundary.
            user_agent_founder:
              - 'backend/agents/agent_team_studio/user_agent_founder/**'
              - 'backend/agents/agent_team_studio/agentic_team_provisioning/**'
              - 'backend/agents/agent_registry/**'
            # Each docker_* filter mirrors what its Dockerfile actually
            # copies into the image, so a change to any baked-in source
            # triggers a rebuild and main never publishes stale code.
            docker_backend:
              - 'backend/Dockerfile'
              - 'backend/requirements-unified-api.txt'
              - 'backend/.dockerignore'
              - 'backend/agents/**'
              - 'backend/unified_api/**'
              - 'backend/run_unified_api.py'
              - 'backend/entrypoint.sh'
              - '.github/workflows/ci.yml'
            docker_blogging_service:
              - 'backend/blogging_service/**'
              - 'backend/.dockerignore'
              - 'backend/agents/blogging/**'
              - 'backend/agents/llm_service/**'
              - 'backend/shared/postgres/**'
              - 'backend/shared/temporal/**'
              - 'backend/shared/observability/**'
              - 'backend/agents/job_service_client.py'
              - 'backend/unified_api/__init__.py'
              - 'backend/unified_api/integrations_store.py'
              - 'backend/unified_api/integration_credentials.py'
              - 'backend/unified_api/postgres_encrypted_credentials.py'
              - 'backend/unified_api/google_browser_login_credentials.py'
              - 'backend/unified_api/medium_browser_login.py'
              - '.github/workflows/ci.yml'
            # team_service Dockerfile copies the entire agents/ tree, so
            # any agent change can require rebuilding this image.
            docker_team_service:
              - 'backend/team_service/**'
              - 'backend/.dockerignore'
              - 'backend/agents/**'
              - 'backend/unified_api/__init__.py'
              - 'backend/unified_api/integrations_store.py'
              - 'backend/unified_api/integration_credentials.py'
              - 'backend/unified_api/postgres_encrypted_credentials.py'
              - 'backend/unified_api/google_browser_login_credentials.py'
              - 'backend/unified_api/medium_browser_login.py'
              - '.github/workflows/ci.yml'
            docker_frontend:
              - 'user-interface/**'
              - '.github/workflows/ci.yml'

      # Backend paths NOT covered by any per-team or shared_backend filter.
      # Run as a SEPARATE filter step with predicate-quantifier: 'every',
      # because dorny/paths-filter's default 'some' quantifier OR's all
      # rules — including the leading `backend/**` — which would make the
      # `!exclude` rules ineffective. With 'every', a file matches only
      # when it is `backend/**` AND not in any of the negated paths.
      # When this filter trips, the matrix-builder fans out fully so a
      # mixed PR (e.g. investment_team + an uncategorised backend file SE
      # transitively imports) doesn't under-test.
      - id: filter_unclassified
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: 'every'
          filters: |
            backend_unclassified:
              - 'backend/**'
              # Per-team paths (each has its own filter)
              - '!backend/agents/software_engineering_team/**'
              - '!backend/agents/planning_team/**'
              - '!backend/agents/agent_repair_team/**'
              - '!backend/agents/agent_repo_tools/**'
              - '!backend/agents/blogging/**'
              - '!backend/blogging_service/**'
              - '!backend/agents/market_research_team/**'
              - '!backend/agents/soc2_compliance_team/**'
              - '!backend/agents/investment_team/**'
              - '!backend/agents/social_media_marketing_team/**'
              - '!backend/agents/agent_team_studio/agent_provisioning_team/**'
              - '!backend/agents/agent_registry/**'
              - '!backend/agents/sales_team/**'
              - '!backend/agents/agent_cognition/**'
              - '!backend/agents/agent_team_studio/agent_studio/**'
              - '!backend/agents/agent_team_studio/assistant_kernel/**'
              - '!backend/agents/agent_team_studio/user_agent_founder/**'
              - '!backend/agents/agent_team_studio/agentic_team_provisioning/**'
              # shared_backend paths (already trigger fan-out separately)
              - '!backend/shared/postgres/**'
              - '!backend/shared/neo4j/**'
              - '!backend/shared/cache/**'
              - '!backend/shared/temporal/**'
              - '!backend/shared/agent_invoke/**'
              - '!backend/shared/graph/**'
              - '!backend/shared/observability/**'
              - '!backend/agents/llm_service/**'
              - '!backend/agents/event_bus/**'
              - '!backend/agents/artifact_registry/**'
              - '!backend/agents/job_service_client.py'
              - '!backend/agents/job_service_client_fake.py'
              - '!backend/agents/requirements.txt'
              - '!backend/team_service/**'
              - '!backend/unified_api/**'
              - '!backend/conftest.py'
              - '!backend/pyproject.toml'
              - '!backend/pytest.ini'

      # Build the per-team test matrix. A team enters the matrix when its
      # own files changed, when shared_backend changed (its tests transitively
      # depend on those), or when this workflow file changed (safety net).
      - id: matrix
        env:
          F_CI_WORKFLOW: ${{ steps.filter.outputs.ci_workflow }}
          F_SHARED_BACKEND: ${{ steps.filter.outputs.shared_backend }}
          F_BACKEND_ANY: ${{ steps.filter.outputs.backend_any }}
          F_BACKEND_UNCLASSIFIED: ${{ steps.filter_unclassified.outputs.backend_unclassified }}
          F_SOFTWARE_ENGINEERING: ${{ steps.filter.outputs.software_engineering }}
          F_BLOGGING: ${{ steps.filter.outputs.blogging }}
          F_MARKET_RESEARCH: ${{ steps.filter.outputs.market_research }}
          F_SOC2: ${{ steps.filter.outputs.soc2 }}
          F_INVESTMENT: ${{ steps.filter.outputs.investment }}
          F_SOCIAL_MARKETING: ${{ steps.filter.outputs.social_marketing }}
          F_AGENT_PROVISIONING: ${{ steps.filter.outputs.agent_provisioning }}
          F_AGENT_STUDIO: ${{ steps.filter.outputs.agent_studio }}
          F_ASSISTANT_KERNEL: ${{ steps.filter.outputs.assistant_kernel }}
          F_SALES: ${{ steps.filter.outputs.sales }}
          F_AGENT_REPO_TOOLS: ${{ steps.filter.outputs.agent_repo_tools }}
          F_USER_AGENT_FOUNDER: ${{ steps.filter.outputs.user_agent_founder }}
          F_DOCKER_BLOGGING_SERVICE: ${{ steps.filter.outputs.docker_blogging_service }}
          F_DOCKER_TEAM_SERVICE: ${{ steps.filter.outputs.docker_team_service }}
        run: |
          python3 - <<'PY'
          import json, os

          # Large teams get their own matrix entries; small teams are
          # batched into a single "misc" runner to cut setup overhead.
          large_teams = {
              "software_engineering": {
                  "name": "Software Engineering Team",
                  "tests": "software_engineering_team/tests/",
                  "source": "software_engineering_team",
                  "cov_config": "software_engineering_team/pyproject.toml",
                  "extra_requirements": "software_engineering_team/requirements.txt",
                  "editable_install": "software_engineering_team",
                  "needs_node": True,
                  # Also record shared_* coverage into a data-file artifact so
                  # combine-shared-infra can gate the moved shared code without
                  # re-running these tests (see that job). Includes coding_team,
                  # an in-package SE sub-team whose tests live in
                  # software_engineering_team/tests/ alongside SE's own.
                  "emit_shared_cov": True,
              },
              "blogging": {
                  "name": "Blogging",
                  "tests": "blogging/tests/",
                  "source": "blogging",
                  "extra_requirements": "blogging/requirements.txt",
              },
              "investment": {
                  "name": "Investment Strategy Lab",
                  "tests": "investment_team/tests/",
                  "source": "investment_team",
                  "extra_requirements": "investment_team/requirements-test.txt",
              },
              "agent_provisioning": {
                  "name": "Agent Provisioning",
                  "tests": "agent_team_studio/agent_provisioning_team/tests/",
                  "source": "agent_team_studio.agent_provisioning_team",
                  "extra_requirements": "agent_team_studio/agent_provisioning_team/requirements.txt",
              },
              "agent_studio": {
                  "name": "Agent Studio",
                  "tests": "agent_team_studio/agent_studio/tests/",
                  "source": "agent_team_studio.agent_studio",
                  # Omit live-Postgres store modules from the unit cov gate
                  # (those suites skip without POSTGRES_HOST).
                  "cov_config": "agent_team_studio/agent_studio/pyproject.toml",
              },
              # unified_api lives at backend/unified_api/ (a sibling of backend/agents/,
              # this job's working directory), so its test/source paths are given
              # relative to backend/agents/ — same convention as the Postgres-only
              # shared.postgres / shared.neo4j jobs below, which reach one level up
              # the same way. Installs nothing extra: agents/requirements.txt already
              # covers unified_api's imports (it's the file backend/Dockerfile installs
              # for the unified-api container).
              "unified_api": {
                  "name": "Unified API",
                  "tests": "../unified_api/tests/",
                  "source": "unified_api",
                  # This job's cwd is backend/agents, two levels below the
                  # pyproject.toml that carries unified_api's coverage omit/
                  # exclude_also rules (backend/pyproject.toml) — without this,
                  # --cov-config falls back to the default .coveragerc lookup
                  # and those rules never apply.
                  "cov_config": "../pyproject.toml",
              },
          }

          # Batched into one runner; pytest runs once per team sequentially
          # inside the job to preserve per-team 90 % coverage gates.
          misc_teams = {
              "market_research": {
                  "tests": "market_research_team/tests/",
                  "source": "market_research_team",
              },
              "soc2": {
                  "tests": "soc2_compliance_team/tests/",
                  "source": "soc2_compliance_team",
              },
              "social_marketing": {
                  "tests": "social_media_marketing_team/tests/",
                  "source": "social_media_marketing_team",
              },
              "sales": {
                  "tests": "sales_team/tests/",
                  "source": "sales_team",
              },
              "agent_repo_tools": {
                  "tests": "agent_repo_tools/tests/",
                  "source": "agent_repo_tools",
              },
              "assistant_kernel": {
                  "tests": "agent_team_studio/assistant_kernel/tests/",
                  "source": "agent_team_studio.assistant_kernel",
              },
              "user_agent_founder": {
                  "tests": "agent_team_studio/user_agent_founder/tests/",
                  "source": "agent_team_studio.user_agent_founder",
              },
          }

          misc_entry = {
              "name": "Misc Teams (market_research + soc2 + social_marketing + sales + agent_repo_tools + assistant_kernel + user_agent_founder)",
              "tests": "BATCHED",
              "source": "BATCHED",
              "batched_teams": [v for v in misc_teams.values()],
          }

          all_team_keys = set(large_teams) | set(misc_teams)

          truthy = lambda v: str(v).lower() == "true"

          ci_workflow = truthy(os.environ.get("F_CI_WORKFLOW", "false"))
          shared_backend = truthy(os.environ.get("F_SHARED_BACKEND", "false"))
          backend_unclassified = truthy(os.environ.get("F_BACKEND_UNCLASSIFIED", "false"))

          # Full fan-out for shared deps / unclassified backend changes.
          # ci.yml edits get a reduced fan-out (2 representative teams)
          # instead of running all 8 — catches regressions without
          # burning minutes on every CI iteration commit.
          fan_out_full = shared_backend or backend_unclassified
          fan_out_ci = ci_workflow and not fan_out_full

          per_team = {
              k: truthy(os.environ.get("F_" + k.upper(), "false"))
              for k in all_team_keys
          }

          if fan_out_full:
              changed = {k: True for k in all_team_keys}
          elif fan_out_ci:
              changed = dict(per_team)
              changed["market_research"] = True
              changed["investment"] = True
          else:
              changed = per_team

          entries = [v for k, v in large_teams.items() if changed.get(k)]
          any_misc = any(changed.get(k) for k in misc_teams)
          if any_misc:
              entries.append(misc_entry)

          # integration tests only need to run when shared infra changes
          needs_integration = fan_out_full or shared_backend

          team_services = {
              "docker_blogging_service": {
                  "service": "khala-blogging-service",
                  "dockerfile": "backend/blogging_service/Dockerfile",
              },
              "docker_team_service": {
                  "service": "khala-team-service",
                  "dockerfile": "backend/team_service/Dockerfile",
              },
          }
          team_services_entries = [
              v for k, v in team_services.items()
              if ci_workflow
              or truthy(os.environ.get("F_" + k.upper(), "false"))
          ]

          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a") as f:
              f.write(f"tests_matrix={json.dumps({'include': entries})}\n")
              f.write(f"tests_empty={'true' if not entries else 'false'}\n")
              f.write(
                  f"team_services_matrix={json.dumps({'include': team_services_entries})}\n"
              )
              f.write(
                  f"team_services_empty={'true' if not team_services_entries else 'false'}\n"
              )
              f.write(f"needs_integration={'true' if needs_integration else 'false'}\n")
          PY

  # ── Lint ────────────────────────────────────────────────────────────────────

  lint-python:
    name: Lint Python (ruff)
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      needs.changes.outputs.is_pull_request == 'true' &&
      needs.changes.outputs.lint_python == 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/cache@v4
        with:
          path: backend/.ruff_cache
          key: ruff-${{ runner.os }}-${{ hashFiles('backend/pyproject.toml') }}-${{ github.sha }}
          restore-keys: |
            ruff-${{ runner.os }}-${{ hashFiles('backend/pyproject.toml') }}-
      - run: pip install ruff
      - run: ruff check agents/ shared/ unified_api/ blogging_service/ team_service/
      - run: python agents/software_engineering_team/scripts/check_dbc_docstrings.py

  # ── Tests ───────────────────────────────────────────────────────────────────
  # Test jobs run in parallel with lint — lint failures are surfaced via the
  # `all-checks` gate, not by serializing the critical path.

  test-shared-postgres:
    name: Test – shared.postgres (live Postgres)
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      needs.changes.outputs.is_pull_request == 'true' &&
      needs.changes.outputs.shared_postgres == 'true'
    defaults:
      run:
        working-directory: backend/agents
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=2s
          --health-timeout=3s
          --health-retries=25
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/agents/requirements.txt
      - run: pip install -r requirements.txt
      # PYTHONPATH=.. adds backend/ to sys.path so the registry can import
      # unified_api.postgres and job_service.postgres (both of which live
      # under backend/ rather than backend/agents/).
      - name: register_all_team_schemas against live Postgres
        env:
          PYTHONPATH: ..
        run: python -c "from shared.postgres import register_all_team_schemas; r = register_all_team_schemas(); assert all(r.values()), r"
      # Coverage gate is enforced at 90% line coverage; see CLAUDE.md.
      # ../shared/postgres/tests/ is a filesystem path (backend/shared/ is one
      # level up from backend/agents/); --cov=shared.postgres is the dotted
      # module name. Step-level `env` does not carry over to later steps, so
      # PYTHONPATH=.. must be set again here (not just on the step above) for
      # shared.postgres imports and coverage resolution to work.
      - run: >-
          pytest ../shared/postgres/tests/ -v --tb=short -n 4
          --cov=shared.postgres
          --cov-report=term-missing
          --cov-fail-under=90
        env:
          PYTHONPATH: ..

  # shared_neo4j: the env-gated Graphiti client. Its tests fake graphiti_core and
  # need no live Neo4j or Postgres, so this job carries no service container.
  test-shared-neo4j:
    name: Test – shared.neo4j
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      needs.changes.outputs.is_pull_request == 'true' &&
      needs.changes.outputs.shared_neo4j == 'true'
    defaults:
      run:
        working-directory: backend/agents
    env:
      LLM_PROVIDER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/agents/requirements.txt
      - run: pip install -r requirements.txt
      # PYTHONPATH=.. adds backend/ to sys.path so `shared.neo4j` resolves;
      # ../shared/neo4j/tests/ is the filesystem path from backend/agents/.
      - run: >-
          pytest ../shared/neo4j/tests/ -v --tb=short -n 4
          --cov=shared.neo4j
          --cov-report=term-missing
          --cov-fail-under=90
        env:
          PYTHONPATH: ..

  # shared_cache: unit suite uses FakeRedis; a follow-up step hits live Redis
  # (service container below) for cross-worker hit / fail-open / OOM trim-retry
  # coverage (live OOM test uses CONFIG SET maxmemory+noeviction temporarily).
  test-shared-cache:
    name: Test – shared.cache
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      needs.changes.outputs.is_pull_request == 'true' &&
      needs.changes.outputs.shared_cache == 'true'
    defaults:
      run:
        working-directory: backend/agents
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval=2s
          --health-timeout=3s
          --health-retries=25
    env:
      LLM_PROVIDER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/agents/requirements.txt
      - run: pip install -r requirements.txt
      # BusyBox requirepass escape + AUTH smoke (test_escape_requirepass.py) use
      # ``docker run redis:7.4-alpine`` — same tag as compose. The job's Redis
      # *service* is unauthenticated redis:7-alpine for live FakeRedis-free
      # integration; pull 7.4 explicitly so Alpine tests cannot skip in CI.
      - name: Pull Alpine Redis for requirepass escape tests
        run: docker pull redis:7.4-alpine
        working-directory: ${{ github.workspace }}
      # Unit/FakeRedis suite — deliberately no REDIS_URL so factory tests that
      # expect MemoryBackend stay deterministic. Live Redis is the next step.
      # CI=true makes Alpine escape/AUTH tests hard-fail if the image is missing.
      - run: >-
          pytest ../shared/cache/tests/ -v --tb=short -n 4
          --cov=shared.cache
          --cov-config=../shared/cache/.coveragerc
          --cov-report=term-missing
          --cov-fail-under=90
        env:
          PYTHONPATH: ..
          CI: "true"
      # Migrated consumers against the in-process / FakeRedis path (no REDIS_URL).
      # These suites assert MemoryBackend / in-process single-flight semantics and
      # must not share a live Redis namespace across tests.
      - name: Migrated cache consumers
        run: >-
          pytest software_engineering_team/tests/test_code_review_cache.py
          software_engineering_team/tests/test_shared_review_cache_integration.py
          llm_service/tests/test_compaction.py
          -v --tb=short -n 4
        env:
          PYTHONPATH: ..
      # Live Redis only: dedicated cross-backend hit/fail-open checks, plus the
      # one consumer test marked for live Redis
      # (test_live_redis_chunk_hit_and_outage_fail_open). Do not re-run the rest
      # of the consumer unit suites here — they assume process-local caches and
      # break under a shared Redis DB (cross-test hits / different SF semantics).
      - name: Live Redis integration
        run: >-
          pytest ../shared/cache/tests/test_live_redis.py
          software_engineering_team/tests/test_shared_review_cache_integration.py::test_live_redis_chunk_hit_and_outage_fail_open
          -v --tb=short -m integration
        env:
          PYTHONPATH: ..
          REDIS_URL: redis://localhost:6379/0

  # shared-infra: the neutral packages extracted from software_engineering_team
  # (command runner + error parsing, repo context, LLM recovery, dev models,
  # shared.git, shared.hitl, shared.run_thread_registry). Their unit tests live
  # in the SE suite (which now also includes coding_team's tests, an in-package
  # sub-team moved into software_engineering_team/tests/), which ALSO records
  # shared coverage into a data-file artifact (see the `emit_shared_cov` entry
  # in test-backend). This job re-runs NOTHING — it downloads that artifact,
  # `coverage combine`s it, and gates the moved code at the repo's 90% floor.
  # shared.git/git_utils.py is omitted with the same integration-heavy
  # rationale the SE gate used before the shared-infra extraction (see
  # shared/infra.coveragerc).
  combine-shared-infra:
    name: Test – shared infra packages (coverage combine)
    runs-on: ubuntu-latest
    # always(): still run the shared gate when an UNRELATED matrix entry (e.g.
    # blogging) fails. A genuine SE failure leaves its artifact absent, so the
    # download below fails and this job goes red — the correct signal.
    needs:
      - changes
      - test-backend
    if: >-
      always() &&
      needs.changes.outputs.is_pull_request == 'true' &&
      (needs.changes.outputs.shared_backend == 'true' ||
       needs.changes.outputs.software_engineering == 'true')
    defaults:
      run:
        working-directory: backend/agents
    steps:
      - uses: actions/checkout@v4
      # coverage report re-parses the source .py files at the absolute paths
      # recorded in the data files, so the tree must be present and this job
      # must run from backend/agents (keeps the git_utils.py omit matching).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "coverage>=7.1,<8.0"
      - uses: actions/download-artifact@v4
        with:
          # SE emits coverage-data-software_engineering; merge-multiple lands
          # its .coverage.<source> file directly in backend/agents/ so
          # `coverage combine` (which discovers .coverage.* in CWD) picks it up.
          pattern: coverage-data-*
          merge-multiple: true
          path: backend/agents/
      - run: coverage combine
      # Coverage gate is enforced at 90% line coverage; see CLAUDE.md. --include
      # is required: shared/infra.coveragerc's omit does not drop SE
      # application files, so without it the shared gate would be diluted. omit
      # still wins over --include, so shared.git/git_utils.py stays excluded.
      # rcfile is a filesystem path; backend/shared/ is one level up from
      # backend/agents/ (this job's cwd), hence ../shared/infra.coveragerc.
      - run: >-
          coverage report --rcfile=../shared/infra.coveragerc
          --include='*/shared/command_runner/*,*/shared/repo_context/*,*/shared/llm_recovery/*,*/shared/dev_models/*,*/shared/git/*,*/shared/hitl/*,*/shared/run_thread_registry/*'
          --show-missing
          --fail-under=90

  # agent_cognition: the memory/rules substrate + knowledge-graph layer. Its
  # store/rollup tests need a live Postgres (provided here); the graph tests fake
  # Graphiti, so NEO4J_BOLT_URL stays unset (the disabled seam). The live tests
  # truncate shared tables before each case, so this job runs SERIALLY (no -n).
  test-agent-cognition:
    name: Test – agent_cognition (live Postgres)
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      needs.changes.outputs.is_pull_request == 'true' &&
      needs.changes.outputs.agent_cognition == 'true'
    defaults:
      run:
        working-directory: backend/agents
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=2s
          --health-timeout=3s
          --health-retries=25
    env:
      LLM_PROVIDER: dummy
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/agents/requirements.txt
      - run: pip install -r requirements.txt
      - run: >-
          pytest agent_cognition/tests/ -v --tb=short
          --cov=agent_cognition
          --cov-report=term-missing
          --cov-fail-under=90

  # job_matching's fresh-database schema-registration regression test (proves a
  # queued job_matching_prepare_scan activity can't read user_profiles before that
  # table exists). Deliberately runs ONLY test_schema_registration.py, not
  # job_matching_team/tests/ as a whole — that directory has no general CI presence
  # yet and a sibling test (test_store.py) has a pre-existing, unrelated fixture
  # issue; folding the whole suite in here would trip on that, not on anything this
  # job is meant to guard. No --cov-fail-under gate for the same reason: two
  # targeted tests can't meaningfully cover the whole package.
  test-job-matching-schema-registration:
    name: Test – job_matching schema registration (live Postgres)
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      needs.changes.outputs.is_pull_request == 'true' &&
      needs.changes.outputs.job_matching == 'true'
    defaults:
      run:
        working-directory: backend/agents
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=2s
          --health-timeout=3s
          --health-retries=25
    env:
      LLM_PROVIDER: dummy
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/agents/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest job_matching_team/tests/test_schema_registration.py -v --tb=short -m integration

  # All non-Postgres backend test suites run as a single matrix job. Matrix
  # entries are produced dynamically by the `changes` job — only teams whose
  # files were touched (directly or via shared deps) appear in the matrix.
  test-backend:
    name: "Test – ${{ matrix.name }}"
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      needs.changes.outputs.is_pull_request == 'true' &&
      needs.changes.outputs.tests_matrix_empty != 'true'
    defaults:
      run:
        working-directory: backend/agents
    env:
      LLM_PROVIDER: dummy
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.tests_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.needs_node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # Listing every team's requirements in the cache key keeps the key
          # shared across matrix entries so pip's wheel cache is reused, and
          # invalidates whenever any team's reqs change.
          cache-dependency-path: |
            backend/agents/requirements.txt
            backend/agents/software_engineering_team/requirements.txt
            backend/agents/blogging/requirements.txt
            backend/agents/investment_team/requirements-test.txt
            backend/agents/agent_team_studio/agent_provisioning_team/requirements.txt
      - uses: actions/cache@v4
        with:
          path: |
            backend/.pytest_cache
            backend/agents/.pytest_cache
          key: pytest-${{ runner.os }}-${{ matrix.name }}-${{ github.sha }}
          restore-keys: |
            pytest-${{ runner.os }}-${{ matrix.name }}-
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          if [ -n "${{ matrix.extra_requirements }}" ]; then
            pip install -r "${{ matrix.extra_requirements }}"
          fi
          if [ -n "${{ matrix.editable_install }}" ]; then
            pip install -e "${{ matrix.editable_install }}"
          fi
      # Unit tests only — anything that needs Postgres or the job service is
      # marked `@pytest.mark.integration` and runs in `test-integration`.
      # Coverage gate is enforced per team at 90% line coverage; see CLAUDE.md.
      #
      # Normal entries: single pytest invocation with --cov.
      # Batched entries (source == "BATCHED"): loop over sub-teams, running
      # pytest once per team to preserve per-team 90% coverage gates.
      # emit_shared_cov entries (SE): additionally measure the shared_*
      # packages in the same run and leave a renamed data file for the
      # combine-shared-infra job. The team's OWN gate
      # is re-enforced via a scoped `coverage report --include` so broadening
      # --cov does not fold shared coverage into it — the number is identical to
      # `--cov=<team> --cov-fail-under=90`.
      - run: |
          if [ "${{ matrix.source }}" = "BATCHED" ]; then
            echo '${{ toJSON(matrix.batched_teams) }}' | python3 -c "
          import json, sys, subprocess
          teams = json.load(sys.stdin)
          failed = 0
          for t in teams:
              cmd = [
                  'pytest', t['tests'], '-v', '--tb=short', '-n', '4',
                  '-m', 'not integration',
                  '--cov=' + t['source'],
                  '--cov-report=term-missing',
                  '--cov-fail-under=90',
              ]
              print(f'::group::Testing {t[\"source\"]}')
              rc = subprocess.call(cmd)
              print('::endgroup::')
              if rc != 0:
                  failed = 1
          sys.exit(failed)
          "
          elif [ -n "${{ matrix.emit_shared_cov }}" ]; then
            set -euo pipefail
            COV_CONFIG_ARG=""
            RCFILE_ARG=""
            if [ -n "${{ matrix.cov_config }}" ]; then
              COV_CONFIG_ARG="--cov-config=${{ matrix.cov_config }}"
              RCFILE_ARG="--rcfile=${{ matrix.cov_config }}"
            fi
            # Broaden measurement to the shared packages; defer the gate
            # (--cov-fail-under=0) so `.coverage` is always produced.
            pytest ${{ matrix.tests }} -v --tb=short -n 4 -m "not integration" \
              --cov=${{ matrix.source }} \
              --cov=shared.command_runner \
              --cov=shared.repo_context \
              --cov=shared.llm_recovery \
              --cov=shared.dev_models \
              --cov=shared.git \
              --cov=shared.hitl \
              --cov=shared.run_thread_registry \
              $COV_CONFIG_ARG \
              --cov-report=term-missing \
              --cov-fail-under=0
            # Preserve the union data file for combine-shared-infra BEFORE the
            # own-gate below, so an own-gate failure never suppresses the
            # artifact (the upload step runs with if: always()).
            mv .coverage ".coverage.${{ matrix.source }}"
            # Team's own 90% gate, scoped to its source only — identical
            # semantics to --cov=${{ matrix.source }} --cov-fail-under=90.
            coverage report $RCFILE_ARG \
              --data-file=".coverage.${{ matrix.source }}" \
              --include="*/${{ matrix.source }}/*" \
              --fail-under=90
            # Temporal WorkflowEnvironment tests (code-review + coding-team
            # GitHub-hook e2e) are marked ``integration`` so they stay out of
            # the xdist unit suite above (embedded Temporal test-server
            # startup is heavier than a pure unit case). They do not need
            # Postgres/job-service — only the ephemeral temporalio test
            # binary — so run them here rather than the Postgres integration
            # job. Individual tests skip themselves if that binary cannot be
            # fetched. Coding-team is limited to the GitHub-hook happy-path
            # node (not the whole file) so a pre-existing pause/resume
            # sibling failure does not fail this slice. Do not add
            # claim/Postgres coding-team integration files here.
            pytest software_engineering_team/tests/test_code_review_temporal.py \
              software_engineering_team/tests/test_coding_team_temporal_workflow.py::test_workflow_github_path_prep_pipeline_publish \
              -v --tb=short -m integration
          else
            COV_CONFIG_ARG=""
            if [ -n "${{ matrix.cov_config }}" ]; then
              COV_CONFIG_ARG="--cov-config=${{ matrix.cov_config }}"
            fi
            pytest ${{ matrix.tests }} -v --tb=short -n 4 -m "not integration" \
              --cov=${{ matrix.source }} \
              $COV_CONFIG_ARG \
              --cov-report=term-missing \
              --cov-fail-under=90
          fi

      # Strategy Lab's real-WorkflowEnvironment cancellation regression
      # (drives an actual embedded Temporal test server, so it's marked
      # `integration` and kept out of the `-m "not integration"` run above,
      # same reasoning as the code-review/coding-team integration slice
      # below). Needs only the ephemeral temporalio test-server binary, not
      # Postgres/job-service, so it runs here rather than in the Postgres
      # integration job. Skips itself if that binary cannot be fetched.
      - if: matrix.source == 'investment_team'
        name: Strategy Lab Temporal cancellation (integration)
        run: |
          pytest investment_team/tests/test_strategy_lab_temporal_cancellation.py \
            -v --tb=short -m integration

      # Ship the union coverage data (team + shared_*) to combine-shared-infra.
      # if: always() so a failed own-gate still preserves the artifact; the mv
      # above guarantees the file exists whenever pytest itself passed.
      - name: Upload shared coverage data
        if: always() && matrix.emit_shared_cov
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-${{ matrix.source }}
          # path is relative to GITHUB_WORKSPACE, not defaults.working-directory.
          path: backend/agents/.coverage.${{ matrix.source }}
          # .coverage.* are dotfiles; upload-artifact@v4 skips hidden files
          # unless this is set — without it the artifact is empty and the
          # shared gate would pass on hollow data.
          include-hidden-files: true
          if-no-files-found: error

  # Integration suite: real Postgres + real job service. Currently a sentinel
  # job that boots the infra and runs the marker; per-team integration suites
  # are filed as follow-up issues.
  test-integration:
    name: Test – integration (Postgres + job service)
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      needs.changes.outputs.is_pull_request == 'true' &&
      needs.changes.outputs.needs_integration == 'true'
    defaults:
      run:
        working-directory: backend/agents
    services:
      # 16-alpine matches the pin used elsewhere in the project
      # (backend/agent_sandbox_image/sandbox-stack.yml) and specifically
      # avoids the (unpublished, non-startable) Postgres 18 alpine tag.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=2s
          --health-timeout=3s
          --health-retries=25
    env:
      LLM_PROVIDER: dummy
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/agents/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # The job service is started as a sidecar process below; it needs
          # psycopg2-binary from its own reqs file.
          pip install -r ../job_service/requirements.txt
      # Boot the job-service sidecar AND run pytest in a single step so the
      # background process is guaranteed to be alive when pytest collects.
      # PYTHONPATH=..:../agents is required: `..` lets the job-service
      # process (cwd backend/job_service) import `shared.postgres`, which
      # now lives under backend/shared/; `../agents` keeps backend/agents/
      # on the path for team-module imports.
      - name: Start job-service + run integration tests
        env:
          PYTHONPATH: ..:../agents
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          JOB_SERVICE_URL: http://127.0.0.1:8085
        run: |
          set -euo pipefail
          (cd ../job_service && \
            uvicorn main:app --host 127.0.0.1 --port 8085 > /tmp/job-service.log 2>&1) &
          JOB_SERVICE_PID=$!
          trap '
            echo "--- job-service log ---";
            tail -100 /tmp/job-service.log || true;
            kill "$JOB_SERVICE_PID" 2>/dev/null || true;
          ' EXIT
          # 60 × 0.5s = 30s budget; service usually ready in 2–3s, faster
          # polling means we proceed sooner without shrinking the cold-start
          # safety budget.
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8085/health >/dev/null; then
              echo "job-service is up after ~$((i * 5 / 10))s"
              break
            fi
            if ! kill -0 "$JOB_SERVICE_PID" 2>/dev/null; then
              echo "job-service exited prematurely; tail of log:"
              tail -100 /tmp/job-service.log
              exit 1
            fi
            sleep 0.5
          done
          if ! curl -sf http://127.0.0.1:8085/health >/dev/null; then
            echo "job-service did not become healthy in 30s; tail of log:"
            tail -100 /tmp/job-service.log
            exit 1
          fi
          pytest -v --tb=short -m integration \
            ../unified_api/tests/test_integration_smoke.py

  # Branding runs its FULL suite (integration + unit) against real Postgres + a
  # job-service sidecar, gated at 90% coverage. Branding's comprehensive tests
  # (endpoints, assistant, store) are integration-marked, so this job — not the
  # -m "not integration" misc-teams job — is where they run. The marker
  # expression "integration or not integration" un-skips the integration tests
  # (conftest only skips them when "integration" is absent from -m) while still
  # running the unit tests, so coverage reflects the whole package.
  test-branding:
    name: Test – Branding (full suite, Postgres + job service)
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      needs.changes.outputs.is_pull_request == 'true' &&
      needs.changes.outputs.branding == 'true'
    defaults:
      run:
        working-directory: backend/agents
    services:
      # trust auth so the ephemeral CI database needs no password (avoids a
      # hardcoded dummy credential); connections come only from this runner.
      # 16-alpine matches the pin used elsewhere in the project
      # (backend/agent_sandbox_image/sandbox-stack.yml) and specifically
      # avoids the (unpublished, non-startable) Postgres 18 alpine tag.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=2s
          --health-timeout=3s
          --health-retries=25
    env:
      LLM_PROVIDER: dummy
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/agents/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # The job service is started as a sidecar process below; it needs
          # psycopg2-binary from its own reqs file.
          pip install -r ../job_service/requirements.txt
      # Boot the job-service sidecar AND run pytest in a single step so the
      # background process is guaranteed to be alive when pytest collects.
      # PYTHONPATH=..:../agents is required: `..` lets the job-service
      # process (cwd backend/job_service) import `shared.postgres`, which
      # now lives under backend/shared/; `../agents` keeps backend/agents/
      # on the path for team-module imports.
      - name: Start job-service + run branding suite with coverage
        env:
          PYTHONPATH: ..:../agents
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          JOB_SERVICE_URL: http://127.0.0.1:8085
        run: |
          set -euo pipefail
          (cd ../job_service && \
            uvicorn main:app --host 127.0.0.1 --port 8085 > /tmp/job-service.log 2>&1) &
          JOB_SERVICE_PID=$!
          trap '
            echo "--- job-service log ---";
            tail -100 /tmp/job-service.log || true;
            kill "$JOB_SERVICE_PID" 2>/dev/null || true;
          ' EXIT
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8085/health >/dev/null; then
              echo "job-service is up after ~$((i * 5 / 10))s"
              break
            fi
            if ! kill -0 "$JOB_SERVICE_PID" 2>/dev/null; then
              echo "job-service exited prematurely; tail of log:"
              tail -100 /tmp/job-service.log
              exit 1
            fi
            sleep 0.5
          done
          if ! curl -sf http://127.0.0.1:8085/health >/dev/null; then
            echo "job-service did not become healthy in 30s; tail of log:"
            tail -100 /tmp/job-service.log
            exit 1
          fi
          pytest -v --tb=short -m "integration or not integration" \
            branding_team/tests/ \
            --cov=branding_team --cov-report=term-missing --cov-fail-under=90

  lint-and-test-ui:
    name: Lint & Test – Angular UI
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      needs.changes.outputs.is_pull_request == 'true' &&
      needs.changes.outputs.ui == 'true'
    defaults:
      run:
        working-directory: user-interface
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/cache@v4
        id: node-cache
        with:
          path: user-interface/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('user-interface/package-lock.json') }}
      - if: steps.node-cache.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run lint
      - run: npm run test:coverage

  # ── Gate ────────────────────────────────────────────────────────────────────
  # Single convergence point used as the required status check in branch
  # protection. `if: always()` plus per-dependency result evaluation lets
  # legitimately-skipped jobs pass the gate; only `failure` or `cancelled`
  # results fail it.

  all-checks:
    name: All checks passed
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - lint-python
      - lint-and-test-ui
      - test-shared-postgres
      - test-shared-neo4j
      - test-shared-cache
      - combine-shared-infra
      - test-agent-cognition
      - test-backend
      - test-integration
      - test-branding
      - test-job-matching-schema-registration
    steps:
      - name: Verify dependencies
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ["RESULTS"])
          bad = []
          for job, info in results.items():
              status = info.get("result")
              if status not in ("success", "skipped"):
                  bad.append(f"{job}={status}")
          if bad:
              print("Failed dependencies:", ", ".join(bad))
              sys.exit(1)
          print("All checks passed (or were legitimately skipped).")
          PY

  # ── Build & Deploy ──────────────────────────────────────────────────────────
  # Builds run only on push-to-main (never on PRs — they validate but never
  # publish, and branch protection ensures tests passed on the PR event).
  # Each build only runs when its docker_* path filter trips, so an
  # investment-only push doesn't rebuild blogging or team-service images.

  build-backend:
    name: Build Backend Docker image
    runs-on: ubuntu-latest
    needs:
      - changes
      - all-checks
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (needs.all-checks.result == 'success' || needs.all-checks.result == 'skipped') &&
      needs.changes.outputs.docker_backend == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/khala
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layered cache: GHA for fast same-runner reuse, registry for
          # survival across the 7-day GHA TTL and across PRs.
          cache-from: |
            type=gha,scope=build-backend
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/khala:buildcache
          cache-to: |
            type=gha,mode=max,scope=build-backend
            ${{ github.event_name == 'push' && format('type=registry,ref=ghcr.io/{0}/khala:buildcache,mode=max', github.repository_owner) || '' }}

  build-team-services:
    name: "Build ${{ matrix.service }} Docker image"
    runs-on: ubuntu-latest
    needs:
      - changes
      - all-checks
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (needs.all-checks.result == 'success' || needs.all-checks.result == 'skipped') &&
      needs.changes.outputs.team_services_matrix_empty != 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.team_services_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=pr

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          # load: true makes the image available to the local Docker daemon so
          # the smoke step below can `docker run` it. Required for the import
          # smoke check; harmless for push runs (action emits both outputs).
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=${{ matrix.service }}
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:buildcache
          cache-to: |
            type=gha,mode=max,scope=${{ matrix.service }}
            ${{ github.event_name == 'push' && format('type=registry,ref=ghcr.io/{0}/{1}:buildcache,mode=max', github.repository_owner, matrix.service) || '' }}

      # Boot every TEAM_MODULE that runs inside this image and verify it
      # imports cleanly. Catches the "added a top-level import in a team but
      # forgot to add the package to team_service/requirements.txt" class of
      # bug before it ever ships — the unit-test job installs
      # agents/requirements.txt (a different file) so the failure mode only
      # surfaces when the prod container actually starts.
      - name: Import-smoke every TEAM_MODULE
        env:
          MATRIX_DOCKERFILE: ${{ matrix.dockerfile }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          # Strip leading "backend/" so the value matches docker-compose.yml,
          # which uses paths relative to its build context (backend/).
          dockerfile_rel="${MATRIX_DOCKERFILE#backend/}"
          # First tag emitted by docker/metadata-action is the SHA tag, which
          # is always present and unique to this build.
          image_tag=$(printf '%s\n' "$IMAGE_TAGS" | head -n 1)
          echo "Smoke target image: $image_tag"
          echo "Looking for services in docker/docker-compose.yml using dockerfile=$dockerfile_rel"
          modules=$(awk -v df="$dockerfile_rel" '
            /^[[:space:]]+dockerfile:[[:space:]]+/ { current=$2 }
            /^[[:space:]]+TEAM_MODULE:[[:space:]]+/ && current == df { print $2 }
          ' docker/docker-compose.yml | sort -u)
          if [ -z "$modules" ]; then
            echo "No TEAM_MODULE entries found for $dockerfile_rel — nothing to smoke."
            exit 0
          fi
          echo "Modules to import-smoke:"
          printf '  %s\n' $modules
          failed=0
          for m in $modules; do
            echo "::group::import $m"
            # JOB_SERVICE_URL is a hard module-load requirement after #360
            # (job_service_client raises RuntimeError when unset). Pass a
            # placeholder so the constructor validates without phoning home;
            # the import-smoke never actually calls the service.
            if docker run --rm \
                -e TEAM_MODULE="$m" \
                -e TEAM_NAME=smoke \
                -e TEAM_PORT=8000 \
                -e POSTGRES_HOST="" \
                -e JOB_SERVICE_URL="http://job-service.invalid:8085" \
                --entrypoint python \
                "$image_tag" \
                -c "import importlib, sys; importlib.import_module('$m'); sys.stdout.write('ok\n')"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::import $m failed"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

  build-frontend:
    name: Build Frontend Docker image
    runs-on: ubuntu-latest
    needs:
      - changes
      - all-checks
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (needs.all-checks.result == 'success' || needs.all-checks.result == 'skipped') &&
      needs.changes.outputs.docker_frontend == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/khala-ui
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: user-interface
          file: user-interface/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=build-frontend
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/khala-ui:buildcache
          cache-to: |
            type=gha,mode=max,scope=build-frontend
            ${{ github.event_name == 'push' && format('type=registry,ref=ghcr.io/{0}/khala-ui:buildcache,mode=max', github.repository_owner) || '' }}
